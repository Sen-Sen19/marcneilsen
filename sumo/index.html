        <!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sumo Spin Game</title>
        <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: #222;
            border-radius: 50%;
        }
        #info {
            position: absolute;
            top: 10px;
            color: #fff;
            font-family: sans-serif;
        }
        </style>
        </head>
        <body>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const arenaRadius = canvas.width / 2 - 10;
        const COOLDOWN = 2000; // 1 second cooldown

        class Circle {
        constructor(x, y, color) { 
            this.x = x;
            this.y = y;
            this.radius = 20;
            this.color = color;
            this.angle = Math.random() * Math.PI * 2;
            this.rotationSpeed = 0.008;
            this.isCharging = false;
            this.chargeDuration = 700;
            this.chargeSpeed = 3.5;
            this.chargeStartTime = 0;

            this.lastChargeTime = -COOLDOWN; // to allow charging immediately
        }

        canCharge() {
            return performance.now() - this.lastChargeTime >= COOLDOWN;
        }

        charge() {
            if (this.canCharge()) {
            this.isCharging = true;
            this.chargeStartTime = performance.now();
            this.lastChargeTime = performance.now();
            }
        }

        update(deltaTime) {
            if (!this.isCharging) {
            this.angle += this.rotationSpeed * deltaTime;
            } else {
            const now = performance.now();
            if (now - this.chargeStartTime < this.chargeDuration) {
                this.x += Math.cos(this.angle) * this.chargeSpeed;
                this.y += Math.sin(this.angle) * this.chargeSpeed;
            } else {
                this.isCharging = false;
            }
            }
        }

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            // Character
            ctx.fillStyle = this.color;

            
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();

            // Facing indicator
            ctx.strokeStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.lineTo(Math.cos(this.angle)*this.radius, Math.sin(this.angle)*this.radius);
            ctx.stroke();

            // Cooldown overlay (fade)
            const cdRatio = Math.min((performance.now() - this.lastChargeTime) / COOLDOWN, 1);
            if (cdRatio < 1) {
            ctx.fillStyle = 'rgba(100,100,100,0.5)';
            ctx.beginPath();
            ctx.arc(0,0,this.radius,0,Math.PI*2);
            ctx.fill();
            }

            // Cooldown ring
            if (cdRatio < 1) {
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0,0,this.radius+5,-Math.PI/2, -Math.PI/2 + 2*Math.PI*cdRatio);
            ctx.stroke();
            }

            // Timer text
            if (cdRatio < 1) {
            ctx.fillStyle = '#fff';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const remaining = Math.ceil((COOLDOWN - (performance.now() - this.lastChargeTime))/1000);
            ctx.fillText(remaining,0,0);
            }

            ctx.restore();
        }
        }

        // Player and bot
        const player = new Circle(canvas.width / 2 - 50, canvas.height / 2, '#2b2c2b');
        const bot = new Circle(canvas.width / 2 + 50, canvas.height / 2, '#2b2c2b');

        // Reset game
        function resetGame(loser) {
        alert(loser === player ? "You lost!" : "Bot lost!");
        player.x = canvas.width/2-50; player.y = canvas.height/2; player.isCharging=false;
        bot.x = canvas.width/2+50; bot.y = canvas.height/2; bot.isCharging=false;
        player.angle = Math.random()*Math.PI*2; bot.angle = Math.random()*Math.PI*2;
        }

        // Bot logic
        function botThink() {
        if (!bot.isCharging && bot.canCharge()) {
            const dx = player.x - bot.x;
            const dy = player.y - bot.y;
            const targetAngle = Math.atan2(dy, dx);
            const angleDiff = Math.abs(targetAngle - bot.angle) % (Math.PI*2);
            if (angleDiff < 0.4 || angleDiff > Math.PI*2 - 0.4) {
            if (Math.random() < 0.08) bot.charge();
            }
        }
        }
        function handleCollisions() {
        const dx = bot.x - player.x;
        const dy = bot.y - player.y;
        const dist = Math.hypot(dx, dy);
        const minDist = player.radius + bot.radius;
        if (dist < minDist) {
            const nx = dx / dist;
            const ny = dy / dist;
            const push = 3;
            if (player.isCharging && !bot.isCharging) { bot.x += nx*push; bot.y += ny*push; }
            else if (!player.isCharging && bot.isCharging) { player.x -= nx*push; player.y -= ny*push; }
            else if (player.isCharging && bot.isCharging) {
            player.x -= nx*push*0.5; player.y -= ny*push*0.5;
            bot.x += nx*push*0.5; bot.y += ny*push*0.5;
            }
        }

        [player, bot].forEach(c => {
            const dx = c.x - canvas.width/2;
            const dy = c.y - canvas.height/2;
            if (Math.hypot(dx,dy) + c.radius > arenaRadius) resetGame(c);
        });
        }

        // Player click
        canvas.addEventListener('click',()=>player.charge());

        // Game loop
        let lastTime = performance.now();
        function loop() {
        const now = performance.now();
        const deltaTime = now - lastTime;
        lastTime = now;

        ctx.clearRect(0,0,canvas.width,canvas.height);

        // Arena
        ctx.strokeStyle = '#484948';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(canvas.width/2,canvas.height/2,arenaRadius,0,Math.PI*2);
        ctx.stroke();

        player.update(deltaTime); bot.update(deltaTime);
        handleCollisions();
        player.draw(ctx); bot.draw(ctx);
        botThink();

        requestAnimationFrame(loop);
        }
        loop();
        </script>
        </body>
        </html>
