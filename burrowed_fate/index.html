<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NeuroHunt Arena — Pointer Indicator</title>
<style>
  html, body {
    margin: 0;
    overflow: hidden;
    background: #ffffff;
  }
  canvas {
    display: block;
    background: radial-gradient(circle at center, #ffffff 0%, #ffffff 100%);
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script type="module">
import { hawk, initHawk, findPath, moveHawk, drawHawk } from "./hawk.js";
import { generateWalls, generateGrid, walls, cellSize } from "./wall.js";
import { rabbit, initRabbit, moveRabbit, drawRabbit } from "./rabbit.js";


const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

generateWalls(canvas);
const grid = generateGrid(canvas, hawk.size);
initHawk(canvas, grid);
initRabbit(canvas, grid);

let pointer = null;

canvas.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const target = {
    x: Math.floor(x / cellSize),
    y: Math.floor(y / cellSize),
  };

  if (grid[target.y] && grid[target.y][target.x] === 0) {
    const start = {
      x: Math.floor(hawk.x / cellSize),
      y: Math.floor(hawk.y / cellSize),
    };
    hawk.path = findPath(grid, start, target);
    pointer = { x, y, alpha: 1 };
  }
});

function fadePointer() {
  if (pointer) {
    pointer.alpha -= 0.01;
    if (pointer.alpha <= 0) pointer = null;
  }
}

function drawWalls() {
  ctx.fillStyle = "#f0f0f0";
  for (const wall of walls) {
    ctx.beginPath();
    const pts = wall.points;
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fill();
  }
}

function drawPointer() {
  if (pointer) {
    ctx.save();
    ctx.globalAlpha = pointer.alpha;
    ctx.beginPath();
    ctx.arc(pointer.x, pointer.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 80, 80, 0.8)";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(pointer.x, pointer.y, 20, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255, 100, 100, 0.5)";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }
}

function update() {
  moveHawk();
moveRabbit(hawk, grid, canvas);



  fadePointer();

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawWalls();
  drawHawk(ctx);  // triangular hawk from hawk.js
  drawRabbit(ctx);
  drawPointer();

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
