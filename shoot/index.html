<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>AI SHOOTER // best of 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      height: 100vh;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #a3d8d0;
      touch-action: none;
    }
    .joystick {
      position: fixed;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(170, 170, 170, 0.35);
      z-index: 10;
      touch-action: none;
      display: none;
    }
    .knob {
      position: absolute;
      width: 56px;
      height: 56px;
      background: rgba(90, 100, 100, 0.85);
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid #ddd;
    }
    #leftJoystick { bottom: 24px; left: 24px; }
    #rightJoystick { bottom: 24px; right: 24px; width: 120px; height: 120px; }

    .hook-icon {
      position: absolute;
      width: 26px;
      height: 26px;
      background: radial-gradient(circle at center, #ff6b6b 40%, #b02a2a 100%);
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(255, 107, 107, 0.7);
    }
    .cancel-zone {
      position: absolute;
      top: -58px;
      left: 50%;
      transform: translateX(-50%);
      width: 96px;
      height: 34px;
      background: rgba(255, 107, 107, 0.0);
      border: 1px solid rgba(255,107,107,0.4);
      border-radius: 10px;
      color: #ffdada;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      line-height: 34px;
      opacity: 0;
      transition: opacity .15s ease, background .15s ease;
      z-index: 5;
    }
    .cancel-zone.show{ opacity: 1; }
    .cancel-zone.armed{ background: rgba(255,107,107,0.35); }

    #dashBtn {
      position: fixed;
      right: 158px;
      bottom: 40px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(120,220,190,0.5);
      background: rgba(255,255,255,0.15);
      color: #1c6e5c;
      font-size: 20px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      touch-action: none;
    }
    #dashBtn:active{ transform: scale(0.9); }

    body.aiming { cursor: crosshair; }

    #rotateOverlay {
      position: fixed; inset: 0;
      background: #000c;
      color: white;
      display: none;
      z-index: 9999;
      text-align: center;
      padding-top: 40vh;
      font-size: 22px;
    }
    #rotateOverlay button {
      margin-top: 20px; padding: 10px 22px; font-size: 16px;
      border-radius: 8px; border: none; background: #7fd9c4; cursor: pointer;
      font-family: 'Quicksand', sans-serif; font-weight: 700;
    }

    .round-banner {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      z-index: 200;
      font-size: 38px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      text-align: center;
    }
    .round-banner.show{ opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .round-banner .sub{
      font-size: 16px;
      font-weight: 500;
      margin-top: 6px;
      color: #eee;
    }

    #matchOverUI {
      position: fixed; inset: 0;
      background: rgba(10,15,15,0.9);
      color: #fff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      text-align: center;
    }
    #matchOverUI h1{ font-size: 44px; margin: 0 0 8px; }
    #matchOverUI p{ font-size: 15px; color: #cfe; margin: 4px 0 22px; }
    #matchOverUI button {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      background: linear-gradient(180deg,#8fe6cd,#57bfa2);
      color: #06251d;
      cursor: pointer;
    }

    #controlsHint {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 8;
      font-size: 12px;
      color: rgba(40,60,60,0.55);
      font-weight: 600;
      background: rgba(255,255,255,0.55);
      padding: 6px 10px;
      border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="rotateOverlay">
  🔄 Please rotate your device to landscape.<br>
  <button onclick="goFullscreenLandscape()">🔓 Enter Fullscreen</button>
</div>

<canvas id="gameCanvas"></canvas>

<div id="controlsHint">WASD move · hold Q to aim · click to fire · Shift dash</div>

<div id="leftJoystick" class="joystick"><div class="knob"></div></div>
<div id="rightJoystick" class="joystick">
  <div class="hook-icon"></div>
  <div class="cancel-zone">Release to cancel</div>
</div>
<button id="dashBtn">⚡</button>

<div class="round-banner" id="roundBanner">
  <div class="main"></div>
  <div class="sub"></div>
</div>

<div id="matchOverUI">
  <h1 id="matchOverTitle">You Win!</h1>
  <p id="matchOverSub">2 – 1</p>
  <button onclick="resetMatch()">Play Again</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
let width, height;
let riverHeight = 150;
let islandHeight;

// ============================================================
// ORIENTATION / FULLSCREEN (self-contained, no external file needed)
// ============================================================

function goFullscreenLandscape(){
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(()=>{});
  }
  document.getElementById('rotateOverlay').style.display = 'none';
}

function checkOrientation(){
  const overlay = document.getElementById('rotateOverlay');
  if (isTouch && window.innerHeight > window.innerWidth) {
    overlay.style.display = 'block';
  } else {
    overlay.style.display = 'none';
  }
}
window.addEventListener('resize', checkOrientation);
checkOrientation();

if (isTouch){
  document.getElementById('leftJoystick').style.display = 'block';
  document.getElementById('rightJoystick').style.display = 'block';
  document.getElementById('dashBtn').style.display = 'flex';
  document.getElementById('controlsHint').style.display = 'none';
}

// ============================================================
// CONFIG
// ============================================================

const CFG = {
  maxHp: 3,
  shotCooldown: 2000,          // flat cooldown per shot — no magazine, no reload
  dashSpeed: 15,
  dashDuration: 150,
  dashCooldown: 1700,
  invulnAfterDash: 140,
  roundTime: 60,
  winsToTakeMatch: 3,
  powerupEvery: [6000, 10000],
  powerupLifespan: 9000,
  speedBoostDuration: 5000,
  slowDuration: 3500,
  slowFactor: 0.55,
  multishotCount: 3,
  multishotSpread: 0.22,
};

// ============================================================
// ENTITIES
// ============================================================

const player = {
  x: 0, y: 0, size: 50, speed: 5,
  ax: 0, ay: 0, vx: 0, vy: 0,
  moveTarget: null,
  isAiming: false, rotation: 0,
  hp: CFG.maxHp,
  nextShotAt: 0,
  dashing: false, dashTime: 0, dashCdUntil: 0, invulnUntil: 0,
  speedBoostUntil: 0, slowedUntil: 0, hasShield: false, multishotLeft: 0,
  roundWins: 0,
  deathProgress: 0,
  trail: [],
};
window.player = player;

const aiPlayer = {
  x: 100, y: 100, size: 50, speed: 3,
  vx: 0, vy: 0,
  rotation: 0,
  hp: CFG.maxHp,
  nextShotAt: 0,
  dashing: false, dashTime: 0, dashCdUntil: 0, invulnUntil: 0,
  speedBoostUntil: 0, slowedUntil: 0, hasShield: false, multishotLeft: 0,
  roundWins: 0,
  deathProgress: 0,
  moveTarget: null, moveCooldown: 0,
  evadeUntil: 0,
  trail: [],
};

const bullets = [];
const aimDir = { value: null };
const shards = [];
const particles = [];
let obstacles = [];
let powerups = [];
let nextPowerupAt = 0;

let roundTime = CFG.roundTime;
let roundStartAt = 0;
let paused = false;      // gameplay update paused during round transitions
let matchOver = false;
let roundEnding = false;
let shake = 0;
let hitFlash = 0;

// ============================================================
// LAYOUT
// ============================================================

function resizeCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  islandHeight = (height - riverHeight) / 2;
  generateObstacles();
  checkOrientation();
}
window.addEventListener('resize', resizeCanvas);

function spawnPositions(){
  player.x = width / 2;
  player.y = height - islandHeight / 2;
  aiPlayer.x = width / 2;
  aiPlayer.y = islandHeight / 2;
}

function generateObstacles(){
  obstacles = [];
  const jitter = () => (Math.random() - 0.5) * 30;
  // bottom island (player side)
  obstacles.push({ x: width*0.24 + jitter() - 35, y: height - islandHeight*0.55 + jitter() - 25, w: 70, h: 50 });
  obstacles.push({ x: width*0.74 + jitter() - 30, y: height - islandHeight*0.32 + jitter() - 30, w: 60, h: 60 });
  // top island (AI side), mirrored
  obstacles.push({ x: width*0.24 + jitter() - 35, y: islandHeight*0.45 + jitter() - 25, w: 70, h: 50 });
  obstacles.push({ x: width*0.74 + jitter() - 30, y: islandHeight*0.68 + jitter() - 30, w: 60, h: 60 });
}

resizeCanvas();
spawnPositions();

// ============================================================
// AUDIO
// ============================================================

let actx = null, muted = false;
function audioCtx(){ if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
function tone(freq, dur, type='sine', gainVal=0.05, glideTo=null, delay=0){
  if (muted) return;
  try{
    const ac = audioCtx();
    const t0 = ac.currentTime + delay;
    const osc = ac.createOscillator(); const gain = ac.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t0);
    if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    gain.gain.setValueAtTime(gainVal, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain).connect(ac.destination);
    osc.start(t0); osc.stop(t0 + dur);
  }catch(e){}
}
function noiseBurst(dur=0.2, gainVal=0.15, delay=0){
  if (muted) return;
  try{
    const ac = audioCtx();
    const n = Math.floor(ac.sampleRate*dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
    const src = ac.createBufferSource(); src.buffer = buf;
    const gain = ac.createGain();
    const t0 = ac.currentTime + delay;
    gain.gain.setValueAtTime(gainVal, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    src.connect(gain).connect(ac.destination);
    src.start(t0);
  }catch(e){}
}
const sfx = {
  shoot: () => tone(950, 0.06, 'square', 0.03, 300),
  hit: () => { noiseBurst(0.08,0.13); tone(150,0.08,'triangle',0.04,60); },
  shieldBlock: () => { tone(700,0.09,'sine',0.04,1100); tone(500,0.09,'sine',0.03,900,0.05); },
  death: () => { noiseBurst(0.5,0.18); tone(120,0.4,'sawtooth',0.06,30); },
  dash: () => tone(500,0.1,'square',0.04,900),
  pickup: () => { tone(660,0.08,'sine',0.03,900); tone(880,0.1,'sine',0.03,1200,0.06); },
  roundWin: () => { tone(523,0.1,'square',0.03,0,0); tone(659,0.1,'square',0.03,0,0.1); tone(784,0.18,'square',0.035,0,0.2); },
  roundLose: () => { tone(300,0.16,'sawtooth',0.035,180,0); tone(220,0.2,'sawtooth',0.03,140,0.14); },
};

// ============================================================
// HELPERS
// ============================================================

function now(){ return performance.now(); }

function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function circleHitsAnyRect(cx, cy, r, rects){
  for (const rect of rects){
    const closestX = Math.max(rect.x, Math.min(cx, rect.x+rect.w));
    const closestY = Math.max(rect.y, Math.min(cy, rect.y+rect.h));
    if (Math.hypot(cx-closestX, cy-closestY) < r) return true;
  }
  return false;
}

function circleHitsRect(cx, cy, r, rect){
  const closestX = Math.max(rect.x, Math.min(cx, rect.x+rect.w));
  const closestY = Math.max(rect.y, Math.min(cy, rect.y+rect.h));
  return Math.hypot(cx-closestX, cy-closestY) < r;
}

function inRiver(y){ return y > islandHeight && y < islandHeight + riverHeight; }

// Moves an entity toward (nextX,nextY) with axis-separated sliding collision
// against the river band, canvas bounds, and cover obstacles.
function moveWithCollision(entity, nextX, nextY){
  const r = entity.size/2;
  // X axis
  let x = Math.max(r, Math.min(width - r, nextX));
  if (!inRiver(entity.y) && !circleHitsAnyRect(x, entity.y, r, obstacles)){
    entity.x = x;
  }
  // Y axis
  let y = Math.max(r, Math.min(height - r, nextY));
  if (!inRiver(y) && !circleHitsAnyRect(entity.x, y, r, obstacles)){
    entity.y = y;
  }
}

function addShake(a){ shake = Math.min(shake + a, 20); }

function spawnParticles(x, y, color, count, speedMul=1, sizeMul=1){
  for (let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2;
    const s = (0.8 + Math.random()*3.2) * speedMul;
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 300 + Math.random()*300, maxLife: 600,
      color, size: (1.2 + Math.random()*2.2) * sizeMul,
    });
  }
}

function createShatterEffect(x, y, size, color) {
  const pieces = 8;
  for (let i = 0; i < pieces; i++) {
    for (let j = 0; j < pieces; j++) {
      const w = size / pieces, h = size / pieces;
      const px = x - size/2 + i*w, py = y - size/2 + j*h;
      const angle = Math.random()*Math.PI*2;
      const speed = Math.random()*10 + 5;
      shards.push({ x: px, y: py, w, h, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, color, alpha: 1 });
    }
  }
}

// ============================================================
// WEAPON / DASH
// ============================================================

// Single flat cooldown per shot. No magazine, no reload — you can always
// fire again once CFG.shotCooldown has elapsed since your last shot.
function tryFire(shooter, dx, dy){
  const t = now();
  if (shooter.deathProgress > 0) return false;
  if (t < shooter.nextShotAt) return false;

  const angle = Math.atan2(dy, dx);
  const shots = shooter.multishotLeft > 0 ? 3 : 1;

  for (let i=0;i<shots;i++){
    const off = shots === 1 ? 0 : (i - (shots-1)/2) * CFG.multishotSpread;
    const a = angle + off;
    bullets.push({
      x: shooter.x + Math.cos(a)*shooter.size*0.5,
      y: shooter.y + Math.sin(a)*shooter.size*0.5,
      vx: Math.cos(a) * 15,
      vy: Math.sin(a) * 15,
      traveled: 0, maxDist: 1100,
      from: shooter, trail: [],
    });
  }
  if (shooter.multishotLeft > 0) shooter.multishotLeft--;

  shooter.rotation = angle;
  shooter.nextShotAt = t + CFG.shotCooldown;

  const mx = shooter.x + Math.cos(angle)*shooter.size*0.5;
  const my = shooter.y + Math.sin(angle)*shooter.size*0.5;
  spawnParticles(mx, my, '#fff3b0', 10, 2.6, 1.3);
  spawnParticles(mx, my, '#ff7a1a', 5, 1.6, 0.8);
  addShake(shooter === player ? 2 : 1);
  sfx.shoot();
  return true;
}

function tryDash(entity, dx, dy){
  const t = now();
  if (entity.deathProgress > 0) return;
  if (t < entity.dashCdUntil) return;
  let ddx = dx, ddy = dy;
  const mag = Math.hypot(ddx, ddy);
  if (mag < 0.05){
    // no direction given — dash toward current facing
    ddx = Math.cos(entity.rotation); ddy = Math.sin(entity.rotation);
  } else { ddx /= mag; ddy /= mag; }

  entity.dashing = true;
  entity.dashTime = CFG.dashDuration;
  entity.dashDirX = ddx; entity.dashDirY = ddy;
  entity.dashCdUntil = t + CFG.dashCooldown;
  entity.invulnUntil = t + CFG.dashDuration + CFG.invulnAfterDash;
  sfx.dash();
  addShake(3);
}

// ============================================================
// POWERUPS
// ============================================================

const POWERUP_TYPES = [
  { type:'heal',      color:'#ff8a80' },
  { type:'speed',     color:'#7be0a8' },
  { type:'shield',    color:'#82b1ff' },
  { type:'slow',      color:'#c792ea' },
  { type:'multishot',color:'#ffca7a' },
];

function scheduleNextPowerup(){
  const [lo,hi] = CFG.powerupEvery;
  nextPowerupAt = now() + lo + Math.random()*(hi-lo);
}

function trySpawnPowerup(){
  if (now() < nextPowerupAt) return;
  scheduleNextPowerup();
  if (powerups.length >= 3) return;

  let x, y, ok = false, tries = 0;
  while (!ok && tries < 20){
    tries++;
    x = 60 + Math.random()*(width-120);
    y = 60 + Math.random()*(height-120);
    if (inRiver(y)) continue;
    if (circleHitsAnyRect(x, y, 26, obstacles)) continue;
    if (Math.hypot(x-player.x,y-player.y) < 90) continue;
    if (Math.hypot(x-aiPlayer.x,y-aiPlayer.y) < 90) continue;
    ok = true;
  }
  if (!ok) return;

  const def = POWERUP_TYPES[Math.floor(Math.random()*POWERUP_TYPES.length)];
  powerups.push({ x, y, type: def.type, color: def.color, born: now(), bob: Math.random()*Math.PI*2 });
}

function updatePowerups(dt){
  for (let i=powerups.length-1;i>=0;i--){
    const p = powerups[i];
    p.bob += dt*0.004;
    if (now() - p.born > CFG.powerupLifespan){ powerups.splice(i,1); continue; }

    for (const entity of [player, aiPlayer]){
      if (entity.deathProgress > 0) continue;
      if (Math.hypot(entity.x-p.x, entity.y-p.y) < entity.size/2 + 14){
        applyPowerup(entity, p.type);
        spawnParticles(p.x, p.y, p.color, 16, 2, 1);
        sfx.pickup();
        powerups.splice(i,1);
        break;
      }
    }
  }
}

function applyPowerup(entity, type){
  const t = now();
  if (type === 'heal'){
    entity.hp = Math.min(CFG.maxHp, entity.hp + 1);
  } else if (type === 'speed'){
    entity.speedBoostUntil = t + CFG.speedBoostDuration;
  } else if (type === 'shield'){
    entity.hasShield = true;
  } else if (type === 'slow'){
    // debuffs the OPPONENT — picking this up slows the other ship down
    const other = entity === player ? aiPlayer : player;
    other.slowedUntil = t + CFG.slowDuration;
  } else if (type === 'multishot'){
    entity.multishotLeft = CFG.multishotCount;
  }
}

// ============================================================
// GAMEPLAY UPDATE
// ============================================================

function currentSpeed(entity){
  const t = now();
  let s = entity.speed;
  if (t < entity.speedBoostUntil) s *= 1.6;
  if (t < entity.slowedUntil) s *= CFG.slowFactor;
  return s;
}

function updateDash(entity, dt){
  if (!entity.dashing) return;
  entity.dashTime -= dt;
  const nextX = entity.x + entity.dashDirX * CFG.dashSpeed;
  const nextY = entity.y + entity.dashDirY * CFG.dashSpeed;
  moveWithCollision(entity, nextX, nextY);
  entity.trail.push({ x: entity.x, y: entity.y });
  if (entity.trail.length > 5) entity.trail.shift();
  if (entity.dashTime <= 0){ entity.dashing = false; entity.trail = []; }
}

function updatePlayer(dt){
  if (player.deathProgress > 0) return;
  if (player.dashing){ updateDash(player, dt); return; }

  if (player.moveTarget) {
    const dx = player.moveTarget.x - player.x;
    const dy = player.moveTarget.y - player.y;
    const dist = Math.hypot(dx, dy);
    const spd = currentSpeed(player);
    if (dist > spd) {
      moveWithCollision(player, player.x + (dx/dist)*spd, player.y + (dy/dist)*spd);
      player.rotation = Math.atan2(dy, dx);
    } else {
      player.moveTarget = null;
    }
  }

  player.vx += (player.ax - player.vx) * 0.25;
  player.vy += (player.ay - player.vy) * 0.25;
  if (Math.abs(player.vx) > 0.05 || Math.abs(player.vy) > 0.05){
    const spd = currentSpeed(player) / player.speed; // scale factor from boosts
    moveWithCollision(player, player.x + player.vx*spd, player.y + player.vy*spd);
    if (player.vx || player.vy) player.rotation = Math.atan2(player.vy, player.vx);
  }
}

function updateBullets(dt){
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.trail.push({x:b.x, y:b.y});
    if (b.trail.length > 4) b.trail.shift();
    b.x += b.vx; b.y += b.vy;
    b.traveled += Math.hypot(b.vx, b.vy);

    if (b.traveled > b.maxDist || b.x < 0 || b.x > width || b.y < 0 || b.y > height) {
      bullets.splice(i, 1); continue;
    }
    // obstacle collision
    let blocked = false;
    for (const rect of obstacles){
      if (circleHitsRect(b.x, b.y, 5, rect)){
        blocked = true;
        spawnParticles(b.x, b.y, '#c9b79c', 8, 1.6);
        break;
      }
    }
    if (blocked){ bullets.splice(i,1); continue; }
  }
}

function updateAI(dt){
  if (aiPlayer.deathProgress > 0) return;
  if (aiPlayer.dashing){ updateDash(aiPlayer, dt); return; }

  // occasional evasive dash when the player is close
  const distToPlayer = Math.hypot(player.x-aiPlayer.x, player.y-aiPlayer.y);
  if (now() > aiPlayer.dashCdUntil && distToPlayer < 220 && Math.random() < 0.01){
    const away = Math.atan2(aiPlayer.y-player.y, aiPlayer.x-player.x) + (Math.random()-0.5);
    tryDash(aiPlayer, Math.cos(away), Math.sin(away));
  }

  if (aiPlayer.moveCooldown <= 0) {
    let tx, ty, tries=0;
    do {
      tx = Math.random() * width;
      ty = Math.random() * height;
      tries++;
    } while ((inRiver(ty) || circleHitsAnyRect(tx,ty,aiPlayer.size/2,obstacles)) && tries < 20);
    aiPlayer.moveTarget = { x: tx, y: ty };
    aiPlayer.moveCooldown = 50 + Math.random() * 60;
  } else {
    aiPlayer.moveCooldown--;
  }

  if (aiPlayer.moveTarget) {
    const dx = aiPlayer.moveTarget.x - aiPlayer.x;
    const dy = aiPlayer.moveTarget.y - aiPlayer.y;
    const dist = Math.hypot(dx, dy);
    const spd = currentSpeed(aiPlayer);
    if (dist > spd) {
      const nx = aiPlayer.x + (dx/dist)*spd;
      const ny = aiPlayer.y + (dy/dist)*spd;
      const beforeX = aiPlayer.x, beforeY = aiPlayer.y;
      moveWithCollision(aiPlayer, nx, ny);
      aiPlayer.rotation = Math.atan2(dy, dx);
      if (aiPlayer.x === beforeX && aiPlayer.y === beforeY){
        aiPlayer.moveTarget = null; aiPlayer.moveCooldown = 0;
      }
    } else {
      aiPlayer.moveCooldown = 0;
      aiPlayer.moveTarget = null;
    }
  }

  if (now() >= aiPlayer.nextShotAt && Math.random() < 0.035) {
    const target = player;
    const bulletSpeed = 15;
    const toTargetX = target.x - aiPlayer.x;
    const toTargetY = target.y - aiPlayer.y;
    const relVelX = target.vx, relVelY = target.vy;
    const a = relVelX*relVelX + relVelY*relVelY - bulletSpeed*bulletSpeed;
    const b = 2 * (toTargetX*relVelX + toTargetY*relVelY);
    const c = toTargetX*toTargetX + toTargetY*toTargetY;
    const discriminant = b*b - 4*a*c;
    let aimX, aimY;
    if (discriminant >= 0 && a !== 0) {
      const t1 = (-b - Math.sqrt(discriminant)) / (2*a);
      const t2 = (-b + Math.sqrt(discriminant)) / (2*a);
      const t = Math.max(t1, t2);
      if (t > 0) {
        aimX = target.x + target.vx*t + (Math.random()-0.5)*6;
        aimY = target.y + target.vy*t + (Math.random()-0.5)*6;
      }
    }
    if (!aimX || !aimY || isNaN(aimX) || isNaN(aimY)) { aimX = target.x; aimY = target.y; }
    tryFire(aiPlayer, aimX - aiPlayer.x, aimY - aiPlayer.y);
  }
}

function damageEntity(target){
  if (now() < target.invulnUntil) return false;
  if (target.hasShield){
    target.hasShield = false;
    spawnParticles(target.x, target.y, '#82b1ff', 18, 2.8, 1.3);
    addShake(target === player ? 6 : 4);
    sfx.shieldBlock();
    return false; // absorbed — no hp lost
  }
  target.hp--;
  addShake(target === player ? 10 : 6);
  sfx.hit();
  spawnParticles(target.x, target.y, '#ff5252', 12, 2.4);
  if (target === player) hitFlash = 0.5;
  return true;
}

function checkHits() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    const target = (b.from === player) ? aiPlayer : player;
    if (target.deathProgress > 0) continue;
    const dist = Math.hypot(b.x - target.x, b.y - target.y);
    if (dist < target.size / 2) {
      bullets.splice(i, 1);
      damageEntity(target);
    }
  }
  if (player.hp <= 0 && player.deathProgress === 0) {
    player.deathProgress = 0.001;
    addShake(16);
    sfx.death();
    createShatterEffect(player.x, player.y, player.size, '#ffeae5');
  }
  if (aiPlayer.hp <= 0 && aiPlayer.deathProgress === 0) {
    aiPlayer.deathProgress = 0.001;
    addShake(16);
    sfx.death();
    createShatterEffect(aiPlayer.x, aiPlayer.y, aiPlayer.size, '#ffeae5');
  }
}

// ============================================================
// FX-ONLY UPDATE (always runs, even during round transitions)
// ============================================================

function fxUpdate(dt){
  if (player.deathProgress > 0) player.deathProgress += 0.02;
  if (aiPlayer.deathProgress > 0) aiPlayer.deathProgress += 0.02;

  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    s.vy += 0.5; s.x += s.vx; s.y += s.vy; s.alpha -= 0.008;
    if (s.alpha <= 0) shards.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx*(dt/16.67); p.y += p.vy*(dt/16.67);
    p.vx *= 0.93; p.vy *= 0.93;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i,1);
  }
  shake *= 0.88;
  hitFlash *= 0.9;

  if (!roundEnding && !matchOver &&
      ((player.deathProgress > 1) || (aiPlayer.deathProgress > 1))) {
    // wait for shards to fully clear before ending the round
    if (shards.length === 0){
      roundEnding = true;
      endRound();
    }
  }
}

// ============================================================
// ROUND / MATCH FLOW
// ============================================================

function endRound(){
  paused = true;
  const playerDied = player.deathProgress > 0;
  const aiDied = aiPlayer.deathProgress > 0;
  let winner;
  if (playerDied && aiDied) winner = 'draw';
  else if (playerDied) winner = 'ai';
  else winner = 'player';

  if (winner === 'player'){ player.roundWins++; sfx.roundWin(); }
  else if (winner === 'ai'){ aiPlayer.roundWins++; sfx.roundLose(); }

  showRoundBanner(winner);

  setTimeout(() => {
    hideRoundBanner();
    if (player.roundWins >= CFG.winsToTakeMatch || aiPlayer.roundWins >= CFG.winsToTakeMatch){
      showMatchOver();
    } else {
      resetRound();
    }
  }, 1600);
}

function resetRound(){
  bullets.length = 0;
  shards.length = 0;
  particles.length = 0;
  powerups = [];
  generateObstacles();
  spawnPositions();
  scheduleNextPowerup();

  player.hp = CFG.maxHp;
  player.deathProgress = 0; player.moveTarget = null; player.ax = 0; player.ay = 0;
  player.vx = 0; player.vy = 0; player.speedBoostUntil = 0; player.slowedUntil = 0;
  player.hasShield = false; player.multishotLeft = 0; player.nextShotAt = 0;
  player.dashing = false; player.invulnUntil = 0; player.rotation = -Math.PI/2;

  aiPlayer.hp = CFG.maxHp;
  aiPlayer.deathProgress = 0; aiPlayer.moveTarget = null; aiPlayer.moveCooldown = 20;
  aiPlayer.vx = 0; aiPlayer.vy = 0; aiPlayer.speedBoostUntil = 0; aiPlayer.slowedUntil = 0;
  aiPlayer.hasShield = false; aiPlayer.multishotLeft = 0; aiPlayer.nextShotAt = 0;
  aiPlayer.dashing = false; aiPlayer.invulnUntil = 0; aiPlayer.rotation = Math.PI/2;
  aiPlayer.speed = 3 + Math.min(player.roundWins + aiPlayer.roundWins, 4) * 0.12;

  roundTime = CFG.roundTime;
  roundStartAt = now();
  roundEnding = false;
  paused = false;
}

function checkRoundTimer(dt){
  if (paused || matchOver) return;
  roundTime = CFG.roundTime - (now() - roundStartAt) / 1000;
  if (roundTime <= 0 && !roundEnding){
    roundEnding = true;
    paused = true;
    let winner;
    if (player.hp > aiPlayer.hp) winner = 'player';
    else if (aiPlayer.hp > player.hp) winner = 'ai';
    else winner = 'draw';

    if (winner === 'player'){ player.roundWins++; sfx.roundWin(); }
    else if (winner === 'ai'){ aiPlayer.roundWins++; sfx.roundLose(); }

    showRoundBanner(winner, true);
    setTimeout(() => {
      hideRoundBanner();
      if (player.roundWins >= CFG.winsToTakeMatch || aiPlayer.roundWins >= CFG.winsToTakeMatch){
        showMatchOver();
      } else {
        resetRound();
      }
    }, 1600);
  }
}

function showRoundBanner(winner, timeUp){
  const el = document.getElementById('roundBanner');
  const main = el.querySelector('.main');
  const sub = el.querySelector('.sub');
  if (winner === 'player'){ main.textContent = 'ROUND WON'; main.style.color = '#8fe6cd'; }
  else if (winner === 'ai'){ main.textContent = 'ROUND LOST'; main.style.color = '#ff8a80'; }
  else { main.textContent = 'DRAW'; main.style.color = '#fff'; }
  sub.textContent = (timeUp ? "Time's up — " : '') + `${player.roundWins} – ${aiPlayer.roundWins}`;
  el.classList.add('show');
}
function hideRoundBanner(){ document.getElementById('roundBanner').classList.remove('show'); }

function showMatchOver(){
  matchOver = true;
  const won = player.roundWins > aiPlayer.roundWins;
  document.getElementById('matchOverTitle').textContent = won ? 'You Win the Match!' : 'You Lost the Match';
  document.getElementById('matchOverSub').textContent = `${player.roundWins} – ${aiPlayer.roundWins}`;
  document.getElementById('matchOverUI').style.display = 'flex';
}

function resetMatch(){
  document.getElementById('matchOverUI').style.display = 'none';
  player.roundWins = 0; aiPlayer.roundWins = 0;
  matchOver = false;
  resetRound();
}

scheduleNextPowerup();
resetRound();
player.roundWins = 0; aiPlayer.roundWins = 0; // resetRound above shouldn't touch wins, but ensure clean start

// ============================================================
// DRAWING
// ============================================================

function drawBackground(t){
  // islands — warmer layered gradient
  const islandGradTop = ctx.createLinearGradient(0,0,0,islandHeight);
  islandGradTop.addColorStop(0, '#eef8e4');
  islandGradTop.addColorStop(1, '#d8ecc4');
  ctx.fillStyle = islandGradTop;
  ctx.fillRect(0, 0, width, islandHeight);

  const islandGradBot = ctx.createLinearGradient(0,height-islandHeight,0,height);
  islandGradBot.addColorStop(0, '#d8ecc4');
  islandGradBot.addColorStop(1, '#eef8e4');
  ctx.fillStyle = islandGradBot;
  ctx.fillRect(0, height - islandHeight, width, islandHeight);

  // little grass tufts instead of flat dots
  ctx.strokeStyle = 'rgba(110,165,95,0.4)';
  ctx.lineWidth = 1.4;
  for (let i=0;i<50;i++){
    const seed = i*137.5;
    const x = (seed*2.3) % width;
    const y1 = 6 + (seed*1.7) % Math.max(islandHeight-12,1);
    const y2 = height - islandHeight + 6 + ((seed*1.9) % Math.max(islandHeight-12,1));
    for (const y of [y1,y2]){
      ctx.beginPath();
      ctx.moveTo(x, y+5); ctx.lineTo(x-2, y-4);
      ctx.moveTo(x, y+5); ctx.lineTo(x+2, y-4);
      ctx.stroke();
    }
  }

  // deeper teal river with shimmer lines
  const grad = ctx.createLinearGradient(0, islandHeight, 0, islandHeight+riverHeight);
  grad.addColorStop(0, '#bfe6e0');
  grad.addColorStop(0.5, '#a3d8d0');
  grad.addColorStop(1, '#bfe6e0');
  ctx.fillStyle = grad;
  ctx.fillRect(0, islandHeight, width, riverHeight);

  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 2;
  for (let i=0;i<6;i++){
    const yOff = islandHeight + 14 + i*22;
    ctx.beginPath();
    for (let x=0;x<=width;x+=20){
      const y = yOff + Math.sin((x*0.02) + t*0.0016 + i) * 4;
      if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  // drifting sparkle glints on the water
  for (let i=0;i<14;i++){
    const seed = i*911.7;
    const x = (seed + t*0.02) % width;
    const y = islandHeight + 10 + ((seed*1.3) % Math.max(riverHeight-20,1));
    const tw = (Math.sin(t*0.003 + i) + 1) / 2;
    ctx.globalAlpha = tw*0.6;
    ctx.beginPath(); ctx.arc(x,y,1.6,0,Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // bank shadows
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fillRect(0, islandHeight, width, 6);
  ctx.fillRect(0, islandHeight+riverHeight-6, width, 6);

  // soft vignette for depth
  const vg = ctx.createRadialGradient(width/2,height/2, Math.min(width,height)*0.35, width/2,height/2, Math.max(width,height)*0.7);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,20,20,0.12)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,width,height);
}

function drawObstacles(){
  for (const o of obstacles){
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.15)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;
    roundRectPath(o.x, o.y, o.w, o.h, 8);
    const g = ctx.createLinearGradient(o.x, o.y, o.x, o.y+o.h);
    g.addColorStop(0, '#cbb99a');
    g.addColorStop(1, '#a8946f');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    roundRectPath(o.x+2, o.y+2, o.w-4, o.h*0.35, 5);
    ctx.stroke();
    // moss speck for texture
    ctx.beginPath();
    ctx.arc(o.x+o.w*0.72, o.y+o.h*0.7, 4, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(120,150,90,0.35)';
    ctx.fill();
  }
}

function drawPowerupIcon(type, x, y){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.7;
  if (type === 'heal'){
    ctx.beginPath();
    ctx.moveTo(0,4.5);
    ctx.bezierCurveTo(-8,-3, -4,-9, 0,-3.5);
    ctx.bezierCurveTo(4,-9, 8,-3, 0,4.5);
    ctx.fill();
  } else if (type === 'speed'){
    ctx.beginPath();
    ctx.moveTo(-1.5,-8); ctx.lineTo(3,-1); ctx.lineTo(-0.5,-1);
    ctx.lineTo(1.5,8); ctx.lineTo(-3,1); ctx.lineTo(0.5,1);
    ctx.closePath(); ctx.fill();
  } else if (type === 'shield'){
    ctx.beginPath();
    ctx.moveTo(0,-8); ctx.lineTo(6,-5); ctx.lineTo(6,2);
    ctx.quadraticCurveTo(6,7, 0,9.5);
    ctx.quadraticCurveTo(-6,7, -6,2);
    ctx.lineTo(-6,-5); ctx.closePath();
    ctx.stroke();
  } else if (type === 'slow'){
    ctx.beginPath();
    ctx.moveTo(-5,-7); ctx.lineTo(5,-7); ctx.lineTo(-5,7); ctx.lineTo(5,7); ctx.closePath();
    ctx.stroke();
  } else if (type === 'multishot'){
    ctx.beginPath(); ctx.arc(-5,3.5,1.8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-4.5,1.8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,3.5,1.8,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawPowerups(){
  for (const p of powerups){
    const bobY = Math.sin(p.bob) * 4;
    const age = (now() - p.born) / CFG.powerupLifespan;
    const flicker = age > 0.75 ? (Math.sin(now()*0.02) > 0 ? 1 : 0.2) : 1;

    ctx.save();
    ctx.globalAlpha = flicker;
    ctx.beginPath();
    ctx.arc(p.x, p.y+bobY, 16, 0, Math.PI*2);
    ctx.fillStyle = p.color + 'cc';
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 16;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y+bobY, 16, 0, Math.PI*2); ctx.stroke();
    drawPowerupIcon(p.type, p.x, p.y+bobY);
    ctx.restore();
  }
}

function drawShip(entity, bodyBase, glowColor){
  if (entity.deathProgress > 0) return;
  const t = now();
  const invuln = t < entity.invulnUntil;

  // ground shadow
  ctx.beginPath();
  ctx.ellipse(entity.x, entity.y + entity.size*0.42, entity.size*0.4, entity.size*0.16, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fill();

  // dash afterimages
  for (let i=0;i<entity.trail.length;i++){
    const tr = entity.trail[i];
    ctx.globalAlpha = (i/entity.trail.length) * 0.25;
    ctx.beginPath();
    ctx.arc(tr.x, tr.y, entity.size*0.4, 0, Math.PI*2);
    ctx.fillStyle = glowColor;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const hpRatio = entity.hp / CFG.maxHp;
  const fill = hpRatio > 0.66 ? bodyBase.good : hpRatio > 0.33 ? bodyBase.mid : bodyBase.low;
  const s = entity.size;
  const moving = Math.hypot(entity.vx||0, entity.vy||0) > 0.3 || entity.dashing;

  ctx.save();
  ctx.translate(entity.x, entity.y);
  ctx.rotate(entity.rotation);

  if (invuln){
    ctx.globalAlpha = 0.55 + Math.sin(t*0.02)*0.25;
  }

  // engine flame (drawn behind the hull, opposite the facing direction)
  if (moving){
    const flick = 0.6 + Math.random()*0.4;
    ctx.save();
    ctx.rotate(Math.PI);
    ctx.beginPath();
    ctx.moveTo(s*0.42,0);
    ctx.lineTo(s*0.42 + 9*flick, -4.5);
    ctx.lineTo(s*0.42 + 13*flick, 0);
    ctx.lineTo(s*0.42 + 9*flick, 4.5);
    ctx.closePath();
    ctx.fillStyle = glowColor;
    ctx.globalAlpha *= 0.65;
    ctx.fill();
    ctx.restore();
  }

  // diamond-hull body
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.moveTo(s*0.52, 0);
  ctx.lineTo(s*0.2, -s*0.42);
  ctx.lineTo(-s*0.42, -s*0.3);
  ctx.lineTo(-s*0.5, 0);
  ctx.lineTo(-s*0.42, s*0.3);
  ctx.lineTo(s*0.2, s*0.42);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.shadowBlur = 0;

  // panel line
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-s*0.3,0); ctx.lineTo(s*0.35,0);
  ctx.stroke();

  // gun barrel
  ctx.fillStyle = '#7d8b8b';
  ctx.fillRect(s*0.3, -s*0.09, s*0.32, s*0.18);

  // pulsing core "eye"
  const pulse = 0.5 + Math.sin(t*0.006)*0.5;
  ctx.beginPath();
  ctx.arc(-s*0.02, 0, s*0.13 + pulse*1.5, 0, Math.PI*2);
  ctx.fillStyle = glowColor;
  ctx.globalAlpha *= 0.85;
  ctx.fill();
  ctx.globalAlpha = invuln ? (0.55 + Math.sin(t*0.02)*0.25) : 1;
  ctx.beginPath();
  ctx.arc(-s*0.02, 0, s*0.07, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  // crack overlay at low hp
  if (hpRatio <= 0.34){
    ctx.strokeStyle = 'rgba(180,60,60,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-8,-10); ctx.lineTo(2,0); ctx.lineTo(-4,10);
    ctx.moveTo(2,0); ctx.lineTo(12,-6);
    ctx.stroke();
  }

  ctx.globalAlpha = 1;
  ctx.restore();

  // shield ring
  if (entity.hasShield){
    ctx.beginPath();
    ctx.arc(entity.x, entity.y, entity.size*0.62, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(130,177,255,0.85)';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#82b1ff';
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // weapon-cooldown ring — only shows while the shot is still charging
  const cd = entity.nextShotAt - t;
  if (cd > 0){
    const prog = 1 - cd / CFG.shotCooldown;
    ctx.beginPath();
    ctx.arc(entity.x, entity.y - entity.size*0.7, 8, -Math.PI/2, -Math.PI/2 + Math.PI*2*prog);
    ctx.strokeStyle = glowColor;
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

function drawBullets(){
  for (const b of bullets){
    // fading trail
    for (let i=0;i<b.trail.length;i++){
      const tp = b.trail[i];
      const p = i/b.trail.length;
      ctx.globalAlpha = p * 0.55;
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, 6 * p, 0, Math.PI*2);
      ctx.fillStyle = '#ff7a1a';
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // soft outer glow
    ctx.beginPath();
    ctx.arc(b.x, b.y, 11, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,90,0,0.30)';
    ctx.shadowColor = '#ff5a00';
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;

    // dark outline ring — contrast against the pale background
    ctx.beginPath();
    ctx.arc(b.x, b.y, 6.5, 0, Math.PI*2);
    ctx.fillStyle = '#7a1d00';
    ctx.fill();

    // bright hot core
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4.5, 0, Math.PI*2);
    ctx.fillStyle = '#ffdd55';
    ctx.fill();
  }
}

function drawAimLine(){
  if (player.isAiming && aimDir.value && Math.hypot(aimDir.value.dx, aimDir.value.dy) > 0.1) {
    const lineLength = 900;
    const canShoot = now() >= player.nextShotAt;
    ctx.save();
    ctx.setLineDash([10,8]);
    ctx.strokeStyle = canShoot ? 'rgba(255,107,107,0.85)' : 'rgba(160,160,160,0.6)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(player.x + aimDir.value.dx*lineLength, player.y + aimDir.value.dy*lineLength);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(player.x + aimDir.value.dx*140, player.y + aimDir.value.dy*140, 7, 0, Math.PI*2);
    ctx.fillStyle = canShoot ? '#ff6b6b' : '#999';
    ctx.fill();
    ctx.restore();
  }
}

function drawParticlesAndShards(){
  for (const p of particles){
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const s of shards){
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x, s.y, s.w, s.h);
  }
  ctx.globalAlpha = 1;
}

function drawHudCard(x, isRight, entity, name, accent){
  const w = 176, h = 92;
  const px = isRight ? x - w : x;
  ctx.save();
  roundRectPath(px, 14, w, h, 14);
  const cardGrad = ctx.createLinearGradient(px,14,px,14+h);
  cardGrad.addColorStop(0,'rgba(255,255,255,0.85)');
  cardGrad.addColorStop(1,'rgba(255,255,255,0.6)');
  ctx.fillStyle = cardGrad;
  ctx.fill();
  ctx.strokeStyle = accent;
  ctx.lineWidth = 1.5;
  roundRectPath(px, 14, w, h, 14);
  ctx.stroke();

  ctx.textBaseline = 'middle';
  ctx.font = '700 13px Quicksand, sans-serif';
  ctx.fillStyle = '#2b3a3a';
  ctx.textAlign = isRight ? 'right' : 'left';
  ctx.fillText(name, isRight ? px+w-12 : px+12, 30);

  // HP pips
  for (let i=0;i<CFG.maxHp;i++){
    const filled = i < entity.hp;
    const cx = isRight ? px+w-16 - i*20 : px+16 + i*20;
    ctx.beginPath();
    ctx.arc(cx, 52, 6.5, 0, Math.PI*2);
    ctx.fillStyle = filled ? '#ff5c5c' : 'rgba(120,120,120,0.25)';
    ctx.fill();
  }

  // weapon-ready bar — fills up while the shot cooldown ticks down
  const t = now();
  const cdProg = Math.max(0, Math.min(1, 1 - (entity.nextShotAt - t) / CFG.shotCooldown));
  const barW = w - 24, barX = px + 12, barY = 68;
  roundRectPath(barX, barY, barW, 8, 4);
  ctx.fillStyle = 'rgba(120,120,120,0.18)';
  ctx.fill();
  roundRectPath(barX, barY, barW*cdProg, 8, 4);
  ctx.fillStyle = cdProg >= 1 ? accent : 'rgba(160,160,160,0.5)';
  ctx.fill();

  // active-status dots (shield / multishot / slowed) on one side
  const statusX = isRight ? px+w-14 : px+14;
  const statusDir = isRight ? -1 : 1;
  const dots = [];
  if (entity.hasShield) dots.push('#82b1ff');
  if (entity.multishotLeft > 0) dots.push('#ffca7a');
  if (t < entity.slowedUntil) dots.push('#c792ea');
  dots.forEach((c,i)=>{
    const cx = statusX + statusDir*i*13;
    ctx.beginPath(); ctx.arc(cx, 86, 4.2, 0, Math.PI*2);
    ctx.fillStyle = c; ctx.fill();
  });

  // round-win dots on the other side
  for (let i=0;i<CFG.winsToTakeMatch;i++){
    const filled = i < entity.roundWins;
    const cx = isRight ? px+16 + i*13 : px+w-16 - i*13;
    ctx.beginPath();
    ctx.arc(cx, 86, 3.2, 0, Math.PI*2);
    ctx.fillStyle = filled ? '#ffc857' : 'rgba(120,120,120,0.18)';
    ctx.fill();
  }
  ctx.restore();
}

function drawTimer(){
  const t = Math.max(0, Math.ceil(roundTime));
  const mm = String(Math.floor(t/60)).padStart(2,'0');
  const ss = String(t%60).padStart(2,'0');
  const w = 84, h = 34;
  const x = width/2 - w/2, y = 14;
  ctx.save();
  roundRectPath(x,y,w,h,17);
  ctx.fillStyle = t <= 10 ? 'rgba(255,120,120,0.85)' : 'rgba(255,255,255,0.72)';
  ctx.fill();
  ctx.font = '700 16px Quicksand, sans-serif';
  ctx.fillStyle = t <= 10 ? '#fff' : '#2b3a3a';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`${mm}:${ss}`, width/2, y+h/2+1);
  ctx.restore();
}

function render(){
  const t = now();
  ctx.save();
  if (shake > 0.3){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }

  drawBackground(t);
  drawObstacles();
  drawPowerups();
  drawShip(player, {good:'#e3fff6', mid:'#fdffe5', low:'#ffeae5'}, '#57bfa2');
  drawShip(aiPlayer, {good:'#ffe9e9', mid:'#fff2df', low:'#ffd9d9'}, '#ff6b6b');
  drawBullets();
  drawAimLine();
  drawParticlesAndShards();

  ctx.restore();

  drawHudCard(16, false, player, 'YOU', '#57bfa2');
  drawHudCard(width-16, true, aiPlayer, 'RIVAL', '#ff6b6b');
  drawTimer();

  if (hitFlash > 0.02){
    ctx.fillStyle = `rgba(255,60,60,${hitFlash*0.35})`;
    ctx.fillRect(0,0,width,height);
  }
}

// ============================================================
// MAIN LOOP
// ============================================================

let lastTime = now();
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min(t - lastTime, 34);
  lastTime = t;

  fxUpdate(dt);

  if (!paused && !matchOver){
    updatePlayer(dt);
    updateAI(dt);
    updateBullets(dt);
    checkHits();
    updatePowerups(dt);
    trySpawnPowerup();
    checkRoundTimer(dt);
  }

  render();
}
requestAnimationFrame(loop);

// ============================================================
// DESKTOP CONTROLS
// ============================================================

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (player.deathProgress > 0 || paused || matchOver) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if (inRiver(y)) return;
  player.moveTarget = { x, y };
});

canvas.addEventListener('click', (e) => {
  if (player.deathProgress > 0 || paused || matchOver) return;
  if (!player.isAiming) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const dx = x - player.x, dy = y - player.y;
  if (Math.hypot(dx,dy) < 1) return;
  tryFire(player, dx, dy);
  // isAiming stays true while Q is held — see keyup handler — so you can
  // click repeatedly without re-pressing Q for every shot.
});

const keys = {};
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'q') { player.isAiming = true; document.body.classList.add('aiming'); }
  if (e.key === 'Escape' && player.isAiming) { player.isAiming = false; document.body.classList.remove('aiming'); }
  if (k === 'shift') {
    const dx = (keys['d']?1:0) - (keys['a']?1:0);
    const dy = (keys['s']?1:0) - (keys['w']?1:0);
    tryDash(player, dx, dy);
  }
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === 'q') { player.isAiming = false; document.body.classList.remove('aiming'); }
});

function pollKeyboard(){
  if (player.deathProgress > 0) { player.ax = 0; player.ay = 0; return; }
  let x = 0, y = 0;
  if (keys['w'] || keys['arrowup']) y -= 1;
  if (keys['s'] || keys['arrowdown']) y += 1;
  if (keys['a'] || keys['arrowleft']) x -= 1;
  if (keys['d'] || keys['arrowright']) x += 1;
  if (x || y){
    player.moveTarget = null;
    const len = Math.hypot(x,y) || 1;
    player.ax = (x/len) * player.speed;
    player.ay = (y/len) * player.speed;
  } else {
    player.ax = 0; player.ay = 0;
  }
}
setInterval(pollKeyboard, 16);

// ============================================================
// TOUCH CONTROLS (self-contained — left = move, right = aim/fire, button = dash)
// ============================================================

const leftJoystick = document.getElementById('leftJoystick');
const leftKnob = leftJoystick.querySelector('.knob');
const rightJoystick = document.getElementById('rightJoystick');
const hookIcon = rightJoystick.querySelector('.hook-icon');
const cancelZone = rightJoystick.querySelector('.cancel-zone');
const dashBtn = document.getElementById('dashBtn');

const JOY_RADIUS = 46;
let leftPointerId = null, rightPointerId = null;

function joyCenter(el){
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

leftJoystick.addEventListener('pointerdown', e => {
  leftPointerId = e.pointerId;
  leftJoystick.setPointerCapture(e.pointerId);
  handleLeftMove(e);
});
leftJoystick.addEventListener('pointermove', e => { if (e.pointerId===leftPointerId) handleLeftMove(e); });
leftJoystick.addEventListener('pointerup', endLeft);
leftJoystick.addEventListener('pointercancel', endLeft);

function handleLeftMove(e){
  const c = joyCenter(leftJoystick);
  let dx = e.clientX - c.x, dy = e.clientY - c.y;
  const dist = Math.hypot(dx,dy);
  if (dist > JOY_RADIUS){ dx = dx/dist*JOY_RADIUS; dy = dy/dist*JOY_RADIUS; }
  leftKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  player.moveTarget = null;
  player.ax = (dx/JOY_RADIUS) * player.speed;
  player.ay = (dy/JOY_RADIUS) * player.speed;
  e.preventDefault();
}
function endLeft(e){
  if (e.pointerId !== leftPointerId) return;
  leftPointerId = null;
  leftKnob.style.transform = 'translate(-50%, -50%)';
  player.ax = 0; player.ay = 0;
}

rightJoystick.addEventListener('pointerdown', e => {
  if (player.deathProgress > 0 || paused || matchOver) return;
  rightPointerId = e.pointerId;
  rightJoystick.setPointerCapture(e.pointerId);
  player.isAiming = true;
  cancelZone.classList.add('show');
  handleRightMove(e);
});
rightJoystick.addEventListener('pointermove', e => { if (e.pointerId===rightPointerId) handleRightMove(e); });
rightJoystick.addEventListener('pointerup', endRight);
rightJoystick.addEventListener('pointercancel', endRight);

let rightDragDist = 0;
function handleRightMove(e){
  const c = joyCenter(rightJoystick);
  let dx = e.clientX - c.x, dy = e.clientY - c.y;
  const dist = Math.hypot(dx,dy);
  rightDragDist = dist;
  const clamped = Math.min(dist, JOY_RADIUS);
  const nx = dist > 0 ? dx/dist : 0, ny = dist > 0 ? dy/dist : 0;
  hookIcon.style.transform = `translate(calc(-50% + ${nx*clamped}px), calc(-50% + ${ny*clamped}px))`;
  aimDir.value = { dx: nx, dy: ny };
  cancelZone.classList.toggle('armed', dist < 16);
  e.preventDefault();
}
function endRight(e){
  if (e.pointerId !== rightPointerId) return;
  rightPointerId = null;
  hookIcon.style.transform = 'translate(-50%, -50%)';
  cancelZone.classList.remove('show','armed');
  player.isAiming = false;
  if (rightDragDist >= 16 && aimDir.value){
    tryFire(player, aimDir.value.dx, aimDir.value.dy);
  }
  rightDragDist = 0;
}

dashBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (player.deathProgress > 0 || paused || matchOver) return;
  tryDash(player, player.vx || player.ax, player.vy || player.ay);
});
</script>
