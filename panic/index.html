<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PANIC // survive the noise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#050509;
    --bg-1:#0a0a12;
    --accent:#00f0ff;
    --accent-soft:rgba(0,240,255,.35);
    --danger:#ff2954;
    --danger-soft:rgba(255,41,84,.35);
    --warn:#ffb020;
    --void:#b026ff;
    --text:#eef1f7;
    --text-dim:#7d859c;
    --panel-bg:rgba(12,12,20,.78);
    --panel-border:rgba(255,255,255,.08);
    --tier-color:#00f0ff;
    --radius:16px;
    --font:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    height:100%;
    background:var(--bg-0);
    overflow:hidden;
    font-family:var(--font);
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
  }

  canvas{
    display:block;
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
  }

  /* ---------- atmosphere overlays ---------- */

  .vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
    background:radial-gradient(circle at 50% 50%, transparent 40%, rgba(5,5,9,.55) 100%);
    transition:box-shadow .15s ease;
  }

  .flash-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:6;
    background:var(--danger);
    opacity:0;
    mix-blend-mode:screen;
  }

  .scanlines{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:4;
    opacity:.05;
    background:repeating-linear-gradient(0deg, #fff 0px, #fff 1px, transparent 1px, transparent 3px);
  }

  /* ---------- HUD ---------- */

  .hud{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:20;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;
    pointer-events:none;
  }

  .hud-stat{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:64px;
  }

  .hud-stat--right{ align-items:flex-end; text-align:right; }

  .hud-label{
    font-size:10px;
    letter-spacing:.14em;
    color:var(--text-dim);
    text-transform:uppercase;
  }

  .hud-value{
    font-size:22px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
  }

  .panic-meter{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }

  .panic-bars{
    display:flex;
    gap:4px;
  }

  .panic-bar{
    width:8px;
    height:22px;
    border-radius:2px;
    background:rgba(255,255,255,.08);
    border:1px solid var(--panel-border);
    transition:background .25s ease, box-shadow .25s ease;
  }

  .panic-bar.lit{
    background:var(--tier-color);
    box-shadow:0 0 10px var(--tier-color);
    animation:beat var(--beat-speed,1.1s) ease-in-out infinite;
  }

  @keyframes beat{
    0%,100%{ transform:scaleY(1); }
    50%{ transform:scaleY(1.28); }
  }

  .tier-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:.18em;
    color:var(--tier-color);
    text-shadow:0 0 8px var(--tier-color);
  }

  /* ---------- icon buttons ---------- */

  .icon-btn{
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 14px);
    z-index:25;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--panel-border);
    background:var(--panel-bg);
    backdrop-filter:blur(8px);
    color:var(--text);
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease;
  }

  .icon-btn:hover{ border-color:var(--accent-soft); }
  .icon-btn:active{ transform:scale(.92); }
  .icon-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .mute-btn{ right:16px; }
  .pause-btn{ right:64px; }

  /* ---------- dash meter ---------- */

  .dash-meter{
    position:fixed;
    left:50%;
    bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
    transform:translateX(-50%);
    z-index:20;
    width:120px;
    height:5px;
    border-radius:3px;
    background:rgba(255,255,255,.1);
    overflow:hidden;
    pointer-events:none;
  }

  .dash-fill{
    height:100%;
    width:100%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent-soft);
    transform-origin:left;
    transition:transform .05s linear, background .2s ease;
  }

  /* ---------- center panels ---------- */

  .center-stage{
    position:fixed;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }

  .panel{
    pointer-events:auto;
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    backdrop-filter:blur(14px);
    border-radius:var(--radius);
    padding:36px 32px;
    text-align:center;
    max-width:340px;
    width:calc(100vw - 48px);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }

  .panel[hidden]{ display:none; }

  h1.glitch{
    margin:0 0 6px;
    font-size:44px;
    font-weight:800;
    letter-spacing:.06em;
    color:var(--text);
    position:relative;
    text-shadow:0 0 24px var(--accent-soft);
  }

  h1.glitch::before,
  h1.glitch::after{
    content:attr(data-text);
    position:absolute;
    inset:0;
    opacity:.7;
  }

  h1.glitch::before{ color:var(--danger); animation:glitchTop 3.4s infinite linear; }
  h1.glitch::after{ color:var(--accent); animation:glitchBot 2.6s infinite linear; }

  @keyframes glitchTop{
    0%,92%,100%{ clip-path:inset(0 0 100% 0); transform:translate(0,0); }
    93%{ clip-path:inset(10% 0 60% 0); transform:translate(-2px,-1px); }
    95%{ clip-path:inset(50% 0 20% 0); transform:translate(2px,1px); }
    97%{ clip-path:inset(0 0 100% 0); }
  }

  @keyframes glitchBot{
    0%,90%,100%{ clip-path:inset(0 0 100% 0); transform:translate(0,0); }
    91%{ clip-path:inset(70% 0 5% 0); transform:translate(2px,1px); }
    94%{ clip-path:inset(20% 0 65% 0); transform:translate(-2px,-1px); }
    96%{ clip-path:inset(0 0 100% 0); }
  }

  .sub{
    margin:0 0 20px;
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
  }

  .controls-hint{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:22px;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:.03em;
  }

  .controls-hint span{
    background:rgba(255,255,255,.04);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:6px 10px;
  }

  .primary-btn{
    appearance:none;
    border:none;
    border-radius:10px;
    padding:13px 30px;
    font-family:var(--font);
    font-size:14px;
    font-weight:700;
    letter-spacing:.08em;
    color:#04070a;
    background:var(--accent);
    box-shadow:0 0 24px var(--accent-soft);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }

  .primary-btn:hover{ transform:translateY(-1px); box-shadow:0 0 32px var(--accent-soft); }
  .primary-btn:active{ transform:translateY(0) scale(.97); }
  .primary-btn:focus-visible{ outline:2px solid #fff; outline-offset:3px; }

  .primary-btn.danger{ background:var(--danger); color:#1a0206; box-shadow:0 0 24px var(--danger-soft); }

  .countdown-num{
    font-size:96px;
    font-weight:800;
    color:var(--accent);
    text-shadow:0 0 40px var(--accent-soft);
    animation:pop .5s ease;
  }

  @keyframes pop{
    0%{ transform:scale(.4); opacity:0; }
    60%{ transform:scale(1.15); opacity:1; }
    100%{ transform:scale(1); }
  }

  .stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 18px;
    margin:18px 0 24px;
    text-align:left;
  }

  .stat-row{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .stat-row .n{
    font-size:20px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }

  .stat-row .l{
    font-size:10px;
    letter-spacing:.12em;
    color:var(--text-dim);
    text-transform:uppercase;
  }

  .new-best{
    display:inline-block;
    margin-bottom:14px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.1em;
    color:var(--warn);
    padding:4px 10px;
    border:1px solid var(--warn);
    border-radius:20px;
  }

  /* ---------- touch controls ---------- */

  .touch-controls{
    position:fixed;
    inset:0;
    z-index:15;
    pointer-events:none;
    display:none;
  }

  body.touch .touch-controls{ display:block; }

  .joystick{
    position:fixed;
    left:calc(env(safe-area-inset-left,0px) + 26px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    width:104px;
    height:104px;
    border-radius:50%;
    background:rgba(255,255,255,.05);
    border:1px solid var(--panel-border);
    pointer-events:auto;
    touch-action:none;
  }

  .joystick-thumb{
    position:absolute;
    top:50%;
    left:50%;
    width:44px;
    height:44px;
    margin:-22px 0 0 -22px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 16px var(--accent-soft);
    transition:transform .05s linear;
  }

  .dash-btn{
    position:fixed;
    right:calc(env(safe-area-inset-right,0px) + 26px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    width:72px;
    height:72px;
    border-radius:50%;
    border:1px solid var(--panel-border);
    background:var(--panel-bg);
    color:var(--accent);
    font-size:26px;
    pointer-events:auto;
    touch-action:none;
  }

  .dash-btn:active{ transform:scale(.9); }

  @media (min-width:720px){
    .touch-controls{ display:none !important; }
  }

  @media (prefers-reduced-motion:reduce){
    h1.glitch::before,
    h1.glitch::after,
    .panic-bar.lit{ animation:none; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div class="scanlines"></div>
<div class="vignette" id="vignette"></div>
<div class="flash-layer" id="flashLayer"></div>

<header class="hud">
  <div class="hud-stat">
    <span class="hud-label">Time</span>
    <span class="hud-value" id="timeVal">0.0</span>
  </div>

  <div class="panic-meter">
    <div class="panic-bars" id="panicBars">
      <div class="panic-bar"></div>
      <div class="panic-bar"></div>
      <div class="panic-bar"></div>
      <div class="panic-bar"></div>
      <div class="panic-bar"></div>
    </div>
    <span class="tier-label" id="tierLabel">CALM</span>
  </div>

  <div class="hud-stat hud-stat--right">
    <span class="hud-label">Best</span>
    <span class="hud-value" id="bestVal">0.0</span>
  </div>
</header>

<button class="icon-btn mute-btn" id="muteBtn" aria-label="Mute sound">🔊</button>
<button class="icon-btn pause-btn" id="pauseBtn" aria-label="Pause game" hidden>❚❚</button>

<div class="dash-meter" id="dashMeter" hidden><div class="dash-fill" id="dashFill"></div></div>

<div class="center-stage">
  <div class="panel" id="startPanel">
    <h1 class="glitch" data-text="PANIC">PANIC</h1>
    <p class="sub">Something out there wants you dead. Move, dash, don't stop.</p>
    <div class="controls-hint">
      <span>WASD / Arrow keys — move</span>
      <span>Shift or click — dash</span>
    </div>
    <button class="primary-btn" id="startBtn">Start</button>
  </div>

  <div class="panel" id="countdownPanel" hidden>
    <div class="countdown-num" id="countdownNum">3</div>
  </div>

  <div class="panel" id="pausePanel" hidden>
    <h1 class="glitch" data-text="PAUSED" style="font-size:32px;">PAUSED</h1>
    <button class="primary-btn" id="resumeBtn">Resume</button>
  </div>

  <div class="panel" id="overPanel" hidden>
    <span class="new-best" id="newBestTag" hidden>New best</span>
    <h1 class="glitch" data-text="CAUGHT" style="font-size:34px;">CAUGHT</h1>
    <div class="stats-grid">
      <div class="stat-row"><span class="n" id="finalTime">0.0s</span><span class="l">Survived</span></div>
      <div class="stat-row"><span class="n" id="finalTier">Calm</span><span class="l">Reached</span></div>
      <div class="stat-row"><span class="n" id="finalMiss">0</span><span class="l">Close calls</span></div>
      <div class="stat-row"><span class="n" id="finalScore">0</span><span class="l">Score</span></div>
    </div>
    <button class="primary-btn danger" id="retryBtn">Try again</button>
  </div>
</div>

<div class="touch-controls">
  <div class="joystick" id="joystick"><div class="joystick-thumb" id="joystickThumb"></div></div>
  <button class="dash-btn" id="dashBtn" aria-label="Dash">⚡</button>
</div>

<script>
(() => {
  'use strict';

  // ============================================================
  // SETUP
  // ============================================================

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  let W = 0, H = 0;

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ============================================================
  // DOM REFS
  // ============================================================

  const el = {
    time: document.getElementById('timeVal'),
    best: document.getElementById('bestVal'),
    tierLabel: document.getElementById('tierLabel'),
    panicBars: [...document.querySelectorAll('.panic-bar')],
    vignette: document.getElementById('vignette'),
    flash: document.getElementById('flashLayer'),
    dashMeter: document.getElementById('dashMeter'),
    dashFill: document.getElementById('dashFill'),
    muteBtn: document.getElementById('muteBtn'),
    pauseBtn: document.getElementById('pauseBtn'),
    startPanel: document.getElementById('startPanel'),
    countdownPanel: document.getElementById('countdownPanel'),
    countdownNum: document.getElementById('countdownNum'),
    pausePanel: document.getElementById('pausePanel'),
    overPanel: document.getElementById('overPanel'),
    startBtn: document.getElementById('startBtn'),
    resumeBtn: document.getElementById('resumeBtn'),
    retryBtn: document.getElementById('retryBtn'),
    newBestTag: document.getElementById('newBestTag'),
    finalTime: document.getElementById('finalTime'),
    finalTier: document.getElementById('finalTier'),
    finalMiss: document.getElementById('finalMiss'),
    finalScore: document.getElementById('finalScore'),
    joystick: document.getElementById('joystick'),
    joystickThumb: document.getElementById('joystickThumb'),
    dashBtn: document.getElementById('dashBtn'),
  };

  // ============================================================
  // CONFIG
  // ============================================================
  //
  // Hazard pool is always all 5 types: storm, wall, laser, hole, pulse.
  // Each tier just changes the ODDS (weights) of which one spawns next,
  // so the mix is randomized every time rather than unlocking in a fixed
  // order. Early tiers heavily favor storm/wall but still have a small
  // chance of anything else — so you'll see every hazard type from the
  // very first run instead of only after surviving to a later tier.

  const CONFIG = {
    player: {
      r: 9,
      accel: 0.6,
      friction: 0.90,
      maxSpeed: 7.2,
      dashSpeed: 15,
      dashDuration: 140,
      dashCooldown: 1300,
      iframeAfterDash: 280,
      spawnIframe: 1400,
    },
    nearMissBand: 24,
    tiers: [
      { name: 'CALM',        at: 0,  color: '#00f0ff', spawn: 1550, bulletSpeed: 2.0,
        weights: { storm: 70, wall: 15, laser: 10, hole: 5,  pulse: 0  } },
      { name: 'TENSE',       at: 10, color: '#5ee7ff', spawn: 1300, bulletSpeed: 2.4,
        weights: { storm: 45, wall: 25, laser: 20, hole: 8,  pulse: 2  } },
      { name: 'CHAOS',       at: 22, color: '#ffb020', spawn: 1080, bulletSpeed: 2.8,
        weights: { storm: 30, wall: 25, laser: 25, hole: 15, pulse: 5  } },
      { name: 'MELTDOWN',    at: 38, color: '#ff6a3d', spawn: 900,  bulletSpeed: 3.2,
        weights: { storm: 20, wall: 20, laser: 25, hole: 20, pulse: 15 }, double: true },
      { name: 'SINGULARITY', at: 58, color: '#ff2954', spawn: 720,  bulletSpeed: 3.7,
        weights: { storm: 15, wall: 15, laser: 25, hole: 20, pulse: 25 }, double: true },
    ],
  };

  // ============================================================
  // AUDIO (WebAudio synth — no assets needed)
  // ============================================================

  let actx = null;
  let muted = false;

  function audioCtx(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    return actx;
  }

  function tone(freq, dur, type = 'sine', gainVal = 0.06, glideTo = null){
    if (muted) return;
    try{
      const ac = audioCtx();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ac.currentTime);
      if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, ac.currentTime + dur);
      gain.gain.setValueAtTime(gainVal, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      osc.connect(gain).connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + dur);
    }catch(e){}
  }

  function noiseBurst(dur = 0.3, gainVal = 0.12){
    if (muted) return;
    try{
      const ac = audioCtx();
      const bufferSize = ac.sampleRate * dur;
      const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++){
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      }
      const src = ac.createBufferSource();
      src.buffer = buffer;
      const gain = ac.createGain();
      gain.gain.setValueAtTime(gainVal, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      src.connect(gain).connect(ac.destination);
      src.start();
    }catch(e){}
  }

  const sfx = {
    dash: () => tone(500, 0.12, 'square', 0.05, 900),
    nearMiss: () => tone(700, 0.08, 'sine', 0.04, 1100),
    tick: () => tone(220, 0.03, 'sine', 0.015),
    tierUp: () => { tone(300, 0.25, 'sawtooth', 0.05, 700); },
    death: () => { noiseBurst(0.5, 0.18); tone(120, 0.4, 'sawtooth', 0.06, 40); },
    telegraph: () => tone(880, 0.06, 'square', 0.02),
    laserWarnFinal: () => tone(1200, 0.12, 'square', 0.035, 600),
  };

  // ============================================================
  // GAME STATE
  // ============================================================

  let best = parseFloat(localStorage.getItem('panicBestV2') || '0');
  el.best.textContent = best.toFixed(1);

  const state = {
    mode: 'ready', // ready | countdown | playing | paused | gameover
    elapsed: 0,
    spawnTimer: 0,
    tierIndex: 0,
    nearMiss: 0,
    shake: 0,
    flashAlpha: 0,
    lastSecondTick: 0,
  };

  const input = { x: 0, y: 0, dash: false };
  const keys = {};

  const player = {
    x: 0, y: 0, vx: 0, vy: 0,
    r: CONFIG.player.r,
    facing: 0,
    dashing: false,
    dashTime: 0,
    dashCd: 0,
    iframe: 0,
    trail: [],
  };

  let bullets = [];
  let lasers = [];
  let holes = [];
  let pulses = [];
  let particles = [];

  function resetPlayer(){
    player.x = W / 2;
    player.y = H / 2;
    player.vx = 0; player.vy = 0;
    player.facing = 0;
    player.dashing = false;
    player.dashTime = 0;
    player.dashCd = 0;
    player.iframe = CONFIG.player.spawnIframe;
    player.trail = [];
  }

  function resetWorld(){
    bullets = []; lasers = []; holes = []; pulses = []; particles = [];
    state.elapsed = 0;
    state.spawnTimer = 0;
    state.tierIndex = 0;
    state.nearMiss = 0;
    state.shake = 0;
    state.lastSecondTick = 0;
    resetPlayer();
  }

  // ============================================================
  // TIER / DIFFICULTY
  // ============================================================

  function currentTier(){
    let idx = 0;
    for (let i = 0; i < CONFIG.tiers.length; i++){
      if (state.elapsed >= CONFIG.tiers[i].at) idx = i;
    }
    return idx;
  }

  function applyTierVisuals(){
    const t = CONFIG.tiers[state.tierIndex];
    document.documentElement.style.setProperty('--tier-color', t.color);
    document.documentElement.style.setProperty('--beat-speed', (1.15 - state.tierIndex * 0.16) + 's');
    el.tierLabel.textContent = t.name;
    el.panicBars.forEach((bar, i) => bar.classList.toggle('lit', i <= state.tierIndex));
  }

  // ============================================================
  // SPAWNING
  // ============================================================

  function edgePoint(side){
    if (side === 0) return { x: Math.random() * W, y: -20 };
    if (side === 1) return { x: Math.random() * W, y: H + 20 };
    if (side === 2) return { x: -20, y: Math.random() * H };
    return { x: W + 20, y: Math.random() * H };
  }

  function spawnStorm(tier){
    const side = Math.floor(Math.random() * 4);
    const origin = edgePoint(side);
    const baseAngle = Math.atan2(player.y - origin.y, player.x - origin.x);
    const count = 5 + state.tierIndex;
    const spread = 0.7;
    for (let i = 0; i < count; i++){
      const a = baseAngle + (Math.random() - 0.5) * spread;
      const speed = tier.bulletSpeed * (0.85 + Math.random() * 0.4);
      bullets.push({
        x: origin.x, y: origin.y,
        vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        r: 5, state: 'active',
      });
    }
  }

  function spawnWall(tier){
    const side = Math.floor(Math.random() * 4);
    const horizontal = side === 0 || side === 1;
    const length = horizontal ? W : H;
    const spacing = 42;
    const slots = Math.floor(length / spacing);
    const gapStart = Math.floor(Math.random() * (slots - 3)) + 1;
    const gapSize = 2 + (state.tierIndex >= 3 ? 0 : 1);
    const speed = tier.bulletSpeed * 1.1;

    for (let i = 0; i < slots; i++){
      if (i >= gapStart && i < gapStart + gapSize) continue;
      const pos = i * spacing + spacing / 2;
      let x, y, vx, vy;
      if (side === 0) { x = pos; y = -20; vx = 0; vy = speed; }
      else if (side === 1) { x = pos; y = H + 20; vx = 0; vy = -speed; }
      else if (side === 2) { x = -20; y = pos; vx = speed; vy = 0; }
      else { x = W + 20; y = pos; vx = -speed; vy = 0; }

      bullets.push({
        x, y, vx: 0, vy: 0, targetVx: vx, targetVy: vy,
        r: 5.5, state: 'telegraph', telegraph: 550,
      });
    }
    sfx.telegraph();
  }

  function spawnLaser(){
    lasers.push({
      angle: Math.random() * Math.PI,
      state: 'telegraph',
      telegraph: 1150,
      telegraphMax: 1150,
      finalWarned: false,
      active: 850,
      fade: 200,
    });
    sfx.telegraph();
  }

  function spawnHole(){
    holes.push({
      x: 80 + Math.random() * (W - 160),
      y: 80 + Math.random() * (H - 160),
      power: 1400,
      life: 5500,
      maxLife: 5500,
      rot: 0,
    });
  }

  function spawnPulse(){
    pulses.push({
      x: Math.random() * W,
      y: Math.random() * H,
      radius: 0,
      maxRadius: Math.max(W, H) * 0.75,
      speed: 0.25,
      thickness: 26,
      spawnAt: state.elapsed,
    });
    sfx.telegraph();
  }

  const spawners = { storm: spawnStorm, wall: spawnWall, laser: spawnLaser, hole: spawnHole, pulse: spawnPulse };

  // Weighted random pick from a tier's hazard weight table. All 5 hazard
  // types are always in play — only the odds shift by tier — so the
  // spawn order is randomized instead of a fixed unlock sequence.
  function weightedPick(weights){
    const entries = Object.entries(weights).filter(([, w]) => w > 0);
    const total = entries.reduce((sum, [, w]) => sum + w, 0);
    let r = Math.random() * total;
    for (const [type, w] of entries){
      if (r < w) return type;
      r -= w;
    }
    return entries[entries.length - 1][0];
  }

  function spawnEvent(){
    const tier = CONFIG.tiers[state.tierIndex];
    const type = weightedPick(tier.weights);
    spawners[type](tier);
    if (tier.double && Math.random() < 0.4){
      const type2 = weightedPick(tier.weights);
      spawners[type2](tier);
    }
  }

  // ============================================================
  // FX HELPERS
  // ============================================================

  function shake(amount){ state.shake = Math.min(state.shake + amount, 22); }

  function flash(alpha){ state.flashAlpha = Math.max(state.flashAlpha, alpha); }

  function spawnParticles(x, y, color, count, speedMul = 1){
    for (let i = 0; i < count; i++){
      const a = Math.random() * Math.PI * 2;
      const s = (1 + Math.random() * 4) * speedMul;
      particles.push({
        x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 400 + Math.random() * 400,
        maxLife: 800,
        color,
        size: 1.5 + Math.random() * 2.5,
      });
    }
  }

  // ============================================================
  // UPDATE
  // ============================================================

  function updatePlayer(dt){
    const c = CONFIG.player;

    if (player.dashCd > 0) player.dashCd -= dt;
    if (player.iframe > 0) player.iframe -= dt;

    if (player.dashing){
      player.dashTime -= dt;
      if (player.dashTime <= 0) player.dashing = false;
    } else {
      let mx = input.x, my = input.y;
      const len = Math.hypot(mx, my);
      if (len > 1){ mx /= len; my /= len; }
      player.vx += mx * c.accel;
      player.vy += my * c.accel;

      if (len > 0.05) player.facing = Math.atan2(my, mx);

      if (input.dash && player.dashCd <= 0){
        const dashLen = Math.hypot(player.vx, player.vy);
        const dx = dashLen > 0.1 ? player.vx / dashLen : Math.cos(player.facing);
        const dy = dashLen > 0.1 ? player.vy / dashLen : Math.sin(player.facing);
        player.vx = dx * c.dashSpeed;
        player.vy = dy * c.dashSpeed;
        player.dashing = true;
        player.dashTime = c.dashDuration;
        player.dashCd = c.dashCooldown;
        player.iframe = Math.max(player.iframe, c.iframeAfterDash);
        sfx.dash();
        spawnParticles(player.x, player.y, '#00f0ff', 10, 1.5);
      }
    }

    player.vx *= c.friction;
    player.vy *= c.friction;

    const speed = Math.hypot(player.vx, player.vy);
    if (!player.dashing && speed > c.maxSpeed){
      player.vx = (player.vx / speed) * c.maxSpeed;
      player.vy = (player.vy / speed) * c.maxSpeed;
    }

    player.x += player.vx * (dt / 16.67);
    player.y += player.vy * (dt / 16.67);
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.y = Math.max(player.r, Math.min(H - player.r, player.y));

    player.trail.push({ x: player.x, y: player.y });
    if (player.trail.length > 10) player.trail.shift();
  }

  function killPlayer(){
    if (state.mode !== 'playing') return;
    state.mode = 'gameover';
    shake(18);
    flash(0.5);
    sfx.death();
    spawnParticles(player.x, player.y, '#00f0ff', 40, 2.4);
    showGameOver();
  }

  function updateBullets(dt){
    for (let i = bullets.length - 1; i >= 0; i--){
      const b = bullets[i];

      if (b.state === 'telegraph'){
        b.telegraph -= dt;
        if (b.telegraph <= 0){
          b.state = 'active';
          b.vx = b.targetVx; b.vy = b.targetVy;
        }
        continue;
      }

      b.x += b.vx * (dt / 16.67);
      b.y += b.vy * (dt / 16.67);

      if (b.x < -60 || b.x > W + 60 || b.y < -60 || b.y > H + 60){
        bullets.splice(i, 1);
        continue;
      }

      const dx = player.x - b.x, dy = player.y - b.y;
      const dist = Math.hypot(dx, dy);

      if (player.iframe <= 0 && dist < player.r + b.r){
        killPlayer();
        return;
      }

      if (!b.missed && dist < player.r + b.r + CONFIG.nearMissBand){
        b.missed = true;
        state.nearMiss++;
        shake(3);
        sfx.nearMiss();
      }
    }
  }

  function updateLasers(dt){
    for (let i = lasers.length - 1; i >= 0; i--){
      const l = lasers[i];

      if (l.state === 'telegraph'){
        l.telegraph -= dt;
        if (!l.finalWarned && l.telegraph <= 300){
          l.finalWarned = true;
          sfx.laserWarnFinal();
        }
        if (l.telegraph <= 0) l.state = 'active';
        continue;
      }

      if (l.state === 'active'){
        l.active -= dt;
        l.angle += dt * 0.0005;

        const px = player.x - W / 2;
        const py = player.y - H / 2;
        const dist = Math.abs(px * Math.sin(l.angle) - py * Math.cos(l.angle));

        if (player.iframe <= 0 && dist < player.r + 4){
          killPlayer();
          return;
        }
        if (!l.missed && dist < player.r + 4 + CONFIG.nearMissBand){
          l.missed = true;
          state.nearMiss++;
          shake(2);
          sfx.nearMiss();
        }

        if (l.active <= 0) l.state = 'fade';
        continue;
      }

      if (l.state === 'fade'){
        l.fade -= dt;
        if (l.fade <= 0) lasers.splice(i, 1);
      }
    }
  }

  function updateHoles(dt){
    for (let i = holes.length - 1; i >= 0; i--){
      const h = holes[i];
      h.life -= dt;
      h.rot += dt * 0.002;

      const dx = h.x - player.x, dy = h.y - player.y;
      const dist = Math.hypot(dx, dy) || 1;

      if (dist < 200){
        const force = h.power / (dist * dist + 400);
        const clamped = Math.min(force, 0.22);
        player.vx += (dx / dist) * clamped * (dt / 16.67);
        player.vy += (dy / dist) * clamped * (dt / 16.67);
      }

      if (player.iframe <= 0 && dist < 16){
        killPlayer();
        return;
      }

      if (h.life <= 0){
        spawnParticles(h.x, h.y, '#b026ff', 14, 1);
        holes.splice(i, 1);
      }
    }
  }

  function updatePulses(dt){
    for (let i = pulses.length - 1; i >= 0; i--){
      const p = pulses[i];
      p.radius += p.speed * dt;

      const dist = Math.hypot(player.x - p.x, player.y - p.y);
      const inBand = Math.abs(dist - p.radius) < p.thickness / 2;

      if (inBand){
        if (player.iframe <= 0){
          killPlayer();
          return;
        }
      } else if (!p.missed && Math.abs(dist - p.radius) < p.thickness / 2 + CONFIG.nearMissBand){
        p.missed = true;
        state.nearMiss++;
        sfx.nearMiss();
      }

      if (p.radius > p.maxRadius + p.thickness) pulses.splice(i, 1);
    }
  }

  function updateParticles(dt){
    for (let i = particles.length - 1; i >= 0; i--){
      const pt = particles[i];
      pt.x += pt.vx * (dt / 16.67);
      pt.y += pt.vy * (dt / 16.67);
      pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }
  }

  function update(dt){
    if (state.mode !== 'playing'){
      state.shake *= 0.9;
      updateParticles(dt);
      return;
    }

    state.elapsed += dt / 1000;

    const newTier = currentTier();
    if (newTier !== state.tierIndex){
      state.tierIndex = newTier;
      applyTierVisuals();
      shake(8);
      sfx.tierUp();
    }

    if (Math.floor(state.elapsed) !== state.lastSecondTick){
      state.lastSecondTick = Math.floor(state.elapsed);
      sfx.tick();
    }

    state.spawnTimer += dt;
    const interval = CONFIG.tiers[state.tierIndex].spawn;
    if (state.spawnTimer >= interval){
      state.spawnTimer = 0;
      spawnEvent();
    }

    updatePlayer(dt);
    if (state.mode !== 'playing') return;
    updateBullets(dt);
    if (state.mode !== 'playing') return;
    updateLasers(dt);
    if (state.mode !== 'playing') return;
    updateHoles(dt);
    if (state.mode !== 'playing') return;
    updatePulses(dt);
    if (state.mode !== 'playing') return;
    updateParticles(dt);

    state.shake *= 0.9;
    state.flashAlpha *= 0.9;

    el.time.textContent = state.elapsed.toFixed(1);
  }

  // ============================================================
  // DRAW
  // ============================================================

  function drawBackground(){
    ctx.fillStyle = '#050509';
    ctx.fillRect(0, 0, W, H);

    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(20,20,32,0.5)');
    g.addColorStop(1, 'rgba(5,5,9,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawPlayer(){
    // trail
    for (let i = 0; i < player.trail.length; i++){
      const t = player.trail[i];
      const a = (i / player.trail.length) * 0.35;
      ctx.beginPath();
      ctx.arc(t.x, t.y, player.r * (i / player.trail.length), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,240,255,${a})`;
      ctx.fill();
    }

    const invincible = player.iframe > 0;
    const color = invincible ? '#ffffff' : '#00f0ff';

    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.facing);

    ctx.shadowBlur = 18;
    ctx.shadowColor = color;
    ctx.fillStyle = color;

    ctx.beginPath();
    ctx.moveTo(player.r + 4, 0);
    ctx.lineTo(-player.r * 0.7, player.r * 0.85);
    ctx.lineTo(-player.r * 0.3, 0);
    ctx.lineTo(-player.r * 0.7, -player.r * 0.85);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    if (invincible){
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r + 6 + Math.sin(state.elapsed * 20) * 2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    ctx.shadowBlur = 0;
  }

  function drawBullets(){
    for (const b of bullets){
      if (b.state === 'telegraph'){
        const pulse = 0.4 + Math.sin(state.elapsed * 30) * 0.3;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,176,32,${pulse})`;
        ctx.fill();
        continue;
      }

      const angle = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(angle);
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ff2954';
      ctx.fillStyle = '#ff4d6a';
      ctx.beginPath();
      ctx.moveTo(b.r + 3, 0);
      ctx.lineTo(-b.r, b.r * 0.7);
      ctx.lineTo(-b.r, -b.r * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;
  }

  function drawLasers(){
    for (const l of lasers){
      const cx = W / 2, cy = H / 2;
      const x1 = cx + Math.cos(l.angle) * 2000, y1 = cy + Math.sin(l.angle) * 2000;
      const x2 = cx - Math.cos(l.angle) * 2000, y2 = cy - Math.sin(l.angle) * 2000;

      if (l.state === 'telegraph'){
        // urgency goes 0 -> 1 as the telegraph counts down to firing
        const urgency = 1 - Math.max(l.telegraph, 0) / l.telegraphMax;

        // wide translucent band showing the EXACT impact zone, so you
        // know precisely where to not be standing before it fires
        ctx.strokeStyle = `rgba(255,176,32,${0.06 + urgency * 0.16})`;
        ctx.lineWidth = 44;
        ctx.beginPath();
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
        ctx.stroke();

        // pulsing center line, pulse speeds up the closer it is to firing
        const pulseSpeed = 18 + urgency * 45;
        const pulse = 0.35 + Math.sin(state.elapsed * pulseSpeed) * 0.3;
        ctx.setLineDash([12, 10]);
        ctx.strokeStyle = `rgba(255,${Math.round(176 - urgency * 100)},${Math.round(32 + urgency * 40)},${Math.min(pulse + urgency * 0.35, 1)})`;
        ctx.lineWidth = 2 + urgency * 2.5;
        ctx.beginPath();
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.setLineDash([]);
        continue;
      }

      const alpha = l.state === 'fade' ? Math.max(l.fade / 200, 0) : 1;
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#ff2954';
      ctx.strokeStyle = `rgba(255,41,84,${alpha})`;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.8})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  function drawHoles(){
    for (const h of holes){
      const lifeRatio = h.life / h.maxLife;

      ctx.save();
      ctx.translate(h.x, h.y);

      for (let ring = 0; ring < 3; ring++){
        ctx.rotate(h.rot * (ring % 2 === 0 ? 1 : -1));
        ctx.beginPath();
        ctx.ellipse(0, 0, 22 - ring * 5, 10 - ring * 2, 0, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(176,38,255,${0.6 - ring * 0.15})`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#0a0210';
      ctx.shadowBlur = 24;
      ctx.shadowColor = '#b026ff';
      ctx.fill();
      ctx.restore();
      ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.arc(h.x, h.y, 200 * lifeRatio > 200 ? 200 : 200, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(176,38,255,0.08)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawPulses(){
    for (const p of pulses){
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(p.radius, 0), 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,41,84,0.55)';
      ctx.lineWidth = p.thickness;
      ctx.shadowBlur = 16;
      ctx.shadowColor = '#ff2954';
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  function drawParticles(){
    for (const pt of particles){
      const a = pt.life / pt.maxLife;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function draw(){
    ctx.save();

    if (state.shake > 0.3){
      const dx = (Math.random() - 0.5) * state.shake;
      const dy = (Math.random() - 0.5) * state.shake;
      ctx.translate(dx, dy);
    }

    drawBackground();
    drawHoles();
    drawPulses();
    drawLasers();
    drawBullets();
    drawParticles();
    if (state.mode === 'playing' || state.mode === 'countdown') drawPlayer();

    ctx.restore();
  }

  // ============================================================
  // UI SYNC
  // ============================================================

  function syncDashMeter(){
    if (state.mode !== 'playing'){ el.dashMeter.hidden = true; return; }
    el.dashMeter.hidden = false;
    const ratio = 1 - Math.max(player.dashCd, 0) / CONFIG.player.dashCooldown;
    el.dashFill.style.transform = `scaleX(${ratio})`;
    el.dashFill.style.background = ratio >= 1 ? 'var(--accent)' : 'rgba(255,255,255,.25)';
  }

  function syncVignette(){
    const danger = Math.min(state.tierIndex / 4, 1);
    el.vignette.style.boxShadow = `inset 0 0 ${120 + danger * 100}px ${20 + danger * 40}px rgba(255,${41 - danger * 20},84,${0.15 + danger * 0.25})`;
    el.flash.style.opacity = state.flashAlpha.toFixed(2);
  }

  // ============================================================
  // GAME FLOW
  // ============================================================

  function showPanel(name){
    ['startPanel','countdownPanel','pausePanel','overPanel'].forEach(id => {
      document.getElementById(id).hidden = (id !== name);
    });
  }

  function startCountdown(){
    resetWorld();
    state.mode = 'countdown';
    showPanel('countdownPanel');
    el.pauseBtn.hidden = true;

    let n = 3;
    el.countdownNum.textContent = n;
    el.countdownNum.style.animation = 'none';
    void el.countdownNum.offsetWidth;
    el.countdownNum.style.animation = '';

    const iv = setInterval(() => {
      n--;
      if (n <= 0){
        clearInterval(iv);
        beginPlay();
        return;
      }
      el.countdownNum.textContent = n;
      el.countdownNum.style.animation = 'none';
      void el.countdownNum.offsetWidth;
      el.countdownNum.style.animation = '';
      tone(440, 0.08, 'square', 0.03);
    }, 650);
  }

  function beginPlay(){
    state.mode = 'playing';
    applyTierVisuals();
    showPanel(null);
    document.querySelectorAll('.panel').forEach(p => p.hidden = true);
    el.pauseBtn.hidden = false;
    el.dashMeter.hidden = false;
  }

  function showGameOver(){
    const isNewBest = state.elapsed > best;
    if (isNewBest){
      best = state.elapsed;
      localStorage.setItem('panicBestV2', best.toFixed(1));
      el.best.textContent = best.toFixed(1);
    }
    el.newBestTag.hidden = !isNewBest;
    el.finalTime.textContent = state.elapsed.toFixed(1) + 's';
    el.finalTier.textContent = CONFIG.tiers[state.tierIndex].name;
    el.finalMiss.textContent = state.nearMiss;
    el.finalScore.textContent = Math.round(state.elapsed * 10 + state.nearMiss * 5);
    el.pauseBtn.hidden = true;
    el.dashMeter.hidden = true;
    setTimeout(() => showPanel('overPanel'), 550);
  }

  function togglePause(){
    if (state.mode === 'playing'){
      state.mode = 'paused';
      showPanel('pausePanel');
    } else if (state.mode === 'paused'){
      state.mode = 'playing';
      showPanel(null);
      document.querySelectorAll('.panel').forEach(p => p.hidden = true);
    }
  }

  // ============================================================
  // INPUT
  // ============================================================

  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'Shift') input.dash = true;
    if (e.key.toLowerCase() === 'p' || e.key === 'Escape'){
      if (state.mode === 'playing' || state.mode === 'paused') togglePause();
    }
  });

  window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
    if (e.key === 'Shift') input.dash = false;
  });

  function pollKeyboard(){
    let x = 0, y = 0;
    if (keys['arrowup'] || keys['w']) y -= 1;
    if (keys['arrowdown'] || keys['s']) y += 1;
    if (keys['arrowleft'] || keys['a']) x -= 1;
    if (keys['arrowright'] || keys['d']) x += 1;
    if (!isTouch || (x !== 0 || y !== 0)){
      input.x = x; input.y = y;
    }
  }

  // click-to-dash on desktop
  canvas.addEventListener('click', () => {
    if (state.mode === 'playing') input.dash = true;
  });

  // mobile joystick
  let joyActive = false;
  const joyRadius = 42;

  function handleJoyStart(e){
    joyActive = true;
    handleJoyMove(e);
  }
  function handleJoyMove(e){
    if (!joyActive) return;
    const touch = e.touches ? e.touches[0] : e;
    const rect = el.joystick.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = touch.clientX - cx;
    let dy = touch.clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > joyRadius){ dx = (dx / dist) * joyRadius; dy = (dy / dist) * joyRadius; }
    el.joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
    input.x = dx / joyRadius;
    input.y = dy / joyRadius;
    e.preventDefault();
  }
  function handleJoyEnd(){
    joyActive = false;
    input.x = 0; input.y = 0;
    el.joystickThumb.style.transform = 'translate(0,0)';
  }

  el.joystick.addEventListener('touchstart', handleJoyStart, { passive: false });
  el.joystick.addEventListener('touchmove', handleJoyMove, { passive: false });
  el.joystick.addEventListener('touchend', handleJoyEnd);
  el.joystick.addEventListener('touchcancel', handleJoyEnd);

  el.dashBtn.addEventListener('touchstart', e => { e.preventDefault(); input.dash = true; });
  el.dashBtn.addEventListener('touchend', () => { input.dash = false; });

  // buttons
  el.startBtn.addEventListener('click', () => { audioCtx(); startCountdown(); });
  el.retryBtn.addEventListener('click', startCountdown);
  el.resumeBtn.addEventListener('click', togglePause);
  el.pauseBtn.addEventListener('click', togglePause);
  el.muteBtn.addEventListener('click', () => {
    muted = !muted;
    el.muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ============================================================
  // MAIN LOOP
  // ============================================================

  let lastTime = performance.now();

  function loop(now){
    let dt = now - lastTime;
    lastTime = now;
    dt = Math.min(dt, 34);

    pollKeyboard();

    if (state.mode === 'playing'){
      update(dt);
      // one-shot dash consumption for click/tap triggers
      if (!isTouch && !keys['shift']) input.dash = false;
    } else {
      update(dt);
    }

    draw();
    syncDashMeter();
    syncVignette();

    requestAnimationFrame(loop);
  }

  resetPlayer();
  requestAnimationFrame(loop);

})();
</script>
