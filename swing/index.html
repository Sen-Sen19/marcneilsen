<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bean Swing Runner</title>
<style>
body { margin:0; overflow:hidden; background:#111; }
canvas { display:block; }
</style>
</head>
<body>
<script src="../plugins/pixi.min.js"></script>
<script src="../plugins/matter.min.js"></script>

<script>
const app = new PIXI.Application({ width: window.innerWidth, height: window.innerHeight, backgroundColor: 0x111111 });
document.body.appendChild(app.view);

// ---------------- MATTER SETUP ----------------
const Engine = Matter.Engine,
      World = Matter.World,
      Bodies = Matter.Bodies,
      Body = Matter.Body,
      Constraint = Matter.Constraint,
      Vector = Matter.Vector;

let engine = Engine.create();
let world = engine.world;
world.gravity.y = 1.2; // stronger gravity for natural swing

// ---------------- GAME VARIABLES ----------------
const beanRadius = 20;
let beanBody, beanGraphics;
let dots = [], dotGraphicsArr = [], currentConstraint = null;
let mouseDown = false, canSwing = true;
let gameOver = false;
let goText = null;

// ---------------- FUNCTIONS ----------------
function createDot(x,y){
    const dot = Bodies.circle(x,y,5,{ isStatic:true });
    World.add(world,dot);
    dots.push(dot);

    const g = new PIXI.Graphics();
    g.beginFill(0x000378); // dot color
    g.drawCircle(0,0,5);
    g.endFill();
    g.x = x; g.y = y;
    app.stage.addChild(g);
    dotGraphicsArr.push(g);
}

function resetGame(){
    // Clear Matter world
    World.clear(world);
    Engine.clear(engine);

    dots = [];
    dotGraphicsArr = [];
    currentConstraint = null;
    gameOver = false;
    canSwing = true;

    engine = Engine.create();
    world = engine.world;
    world.gravity.y = 1.2;

    // Create bean
    beanBody = Bodies.circle(200, app.screen.height/2, beanRadius, { restitution: 0.8, frictionAir: 0.005 });
    World.add(world, beanBody);

    if(!beanGraphics){
        beanGraphics = new PIXI.Graphics();
        app.stage.addChild(beanGraphics);
    }
    beanGraphics.clear();
    beanGraphics.beginFill(0x747c7d); // bean color
    beanGraphics.drawCircle(0,0,beanRadius);
    beanGraphics.endFill();
    beanGraphics.pivot.set(beanRadius, beanRadius);

    dotGraphicsArr.forEach(g=>app.stage.removeChild(g));
    dotGraphicsArr=[];

    // Initial dots
    createDot(beanBody.position.x + 150, beanBody.position.y - 100);
    for(let i=1;i<15;i++){
        const x = 200 + i*200 + Math.random()*100;
        const y = 100 + Math.random()*400;
        createDot(x,y);
    }

    // Initial constraint
    currentConstraint = Constraint.create({
        bodyA: beanBody,
        bodyB: dots[0],
        stiffness: 0.15,
        length: Math.sqrt((dots[0].position.x-beanBody.position.x)**2 + (dots[0].position.y-beanBody.position.y)**2)
    });
    World.add(world,currentConstraint);

    if(goText){
        app.stage.removeChild(goText);
        goText=null;
    }
}

// ---------------- INITIALIZE ----------------
resetGame();

// ---------------- CONTROLS ----------------
app.view.addEventListener('mousedown', ()=>{
    mouseDown = true;
    canSwing = true;
});
app.view.addEventListener('mouseup', ()=>mouseDown = false);
app.view.addEventListener('touchstart', ()=>{
    mouseDown = true;
    canSwing = true;
});
app.view.addEventListener('touchend', ()=>mouseDown = false);

// Restart on click if game over
app.view.addEventListener('click', ()=>{
    if(gameOver) resetGame();
});

// ---------------- UPDATE LOOP ----------------
app.ticker.add(()=>{
    if(gameOver) return;

    Engine.update(engine, 16.666);

    // Game over if fall
    if(beanBody.position.y > app.screen.height + 50){
        gameOver = true;
        if(currentConstraint) World.remove(world,currentConstraint);

        const style = new PIXI.TextStyle({
            fill: "#720a00",
            fontSize: 60,
            fontWeight: "bold",
            stroke: "#000",
            strokeThickness: 6
        });
        goText = new PIXI.Text("GAME OVER", style);
        goText.anchor.set(0.5);
        goText.x = app.screen.width/2;
        goText.y = app.screen.height/2;
        app.stage.addChild(goText);
        return;
    }

    // Swing snap (only once per click)
    if(mouseDown && canSwing){
        let nearest=null, minDist=Infinity;
        dots.forEach(dot=>{
            const dx=dot.position.x - beanBody.position.x;
            const dy=dot.position.y - beanBody.position.y;
            const dist=Math.sqrt(dx*dx + dy*dy);
            if(dist<minDist && dist<300){ // allow longer reach
                minDist=dist;
                nearest=dot;
            }
        });

        if(nearest && nearest !== currentConstraint?.bodyB){
            if(currentConstraint) World.remove(world,currentConstraint);
            currentConstraint = Constraint.create({
                bodyA: beanBody,
                bodyB: nearest,
                stiffness:0.15,
                length: minDist*1.0
            });
            World.add(world,currentConstraint);

            const dir = Vector.normalise({x: nearest.position.x - beanBody.position.x, y: nearest.position.y - beanBody.position.y});
Body.applyForce(beanBody, beanBody.position, Vector.mult(dir, 0.6)); // much stronger swing



            canSwing = false; // prevent auto snapping
        }
    }

    // Remove constraint on release
    if(!mouseDown && currentConstraint){
        World.remove(world,currentConstraint);
        currentConstraint = null;
    }

    // ---------------- CAMERA ----------------
    const camX = app.screen.width/2 - beanBody.position.x;
    const camY = app.screen.height/2 - beanBody.position.y;

    beanGraphics.x = app.screen.width/2;
    beanGraphics.y = app.screen.height/2;

    dotGraphicsArr.forEach((g,i)=>{
        g.x = dots[i].position.x + camX;
        g.y = dots[i].position.y + camY;
    });

    // Update rope
    let rope = app.stage.getChildByName('rope');
    if(!rope){
        rope = new PIXI.Graphics();
        rope.name='rope';
        app.stage.addChild(rope);
    }
    rope.clear();
    if(currentConstraint){
        rope.lineStyle(3,0x645f60);
        rope.moveTo(beanGraphics.x, beanGraphics.y);
        rope.lineTo(currentConstraint.bodyB.position.x + camX, currentConstraint.bodyB.position.y + camY);
    }

// Generate dots ahead
// Generate dots ahead
if(dots.length < 30){
    const lastDot = dots[dots.length-1];
    const lastX = lastDot.position.x;
    const lastY = lastDot.position.y;

    // Make dots much closer horizontally (70–120 px)
   // Horizontal spacing between 50–100 px
let x = lastX + 50 + Math.random() * 50;

// Vertical spacing +/- 40 px
let y = lastY + (Math.random() * 80 - 40);
y = Math.max(50, Math.min(app.screen.height - 50, y));
createDot(x, y);

    createDot(x, y);
}


});
</script>
</body>
</html>
