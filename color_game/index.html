<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sen Color Game</title>
<style>
:root{
  --bg-950:#05060d;
  --bg-900:#0b0e1c;
  --panel:#12162a;
  --panel-soft:rgba(255,255,255,0.035);
  --border:rgba(255,255,255,0.09);
  --gold:#ffcf5c;
  --gold-dim:#8a6d2c;
  --ink:#f3f5fc;
  --muted:#8b93ad;
  --win:#3ddc97;
  --lose:#ff5d72;
  --radius-lg:20px;
  --radius-md:12px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{ box-sizing:border-box; }
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,"Segoe UI",Roboto,Arial;
  background:
    radial-gradient(circle at 50% -10%, rgba(255,207,92,0.08), transparent 45%),
    radial-gradient(circle at 100% 100%, rgba(61,220,151,0.06), transparent 50%),
    linear-gradient(180deg, var(--bg-950) 0%, var(--bg-900) 100%);
  color:var(--ink);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:22px 16px;
}

.wrap{
  width:100%;
  max-width:1000px;
  display:grid;
  grid-template-columns:300px 1fr;
  gap:16px;
}
@media (max-width:880px){ .wrap{ grid-template-columns:1fr; } }

/* ---------------- panels ---------------- */
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:0 20px 46px -16px rgba(0,0,0,0.55);
  padding:18px;
}
.side{ display:flex; flex-direction:column; gap:16px; }

.balance-block{ display:flex; align-items:baseline; justify-content:space-between; }
.money{ font-size:30px; font-weight:800; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; }
.eyebrow{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }

.payout-table{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  padding:10px;
  background:var(--panel-soft);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
}
.payout-table div{
  text-align:center;
  font-size:11.5px;
  color:var(--muted);
  line-height:1.5;
}
.payout-table strong{ display:block; font-size:15px; color:var(--gold); font-weight:800; }

label{ font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px; }

input[type=number]{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  color:inherit;
  font-size:15px;
  font-weight:600;
}
input[type=number]:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }

.colors{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.color-btn{
  padding:10px 6px;
  border-radius:10px;
  border:2px solid transparent;
  cursor:pointer;
  text-align:center;
  font-weight:800;
  font-size:12.5px;
  color:#0b0e1a;
  transition:transform .14s var(--ease), box-shadow .14s var(--ease), border-color .14s var(--ease);
}
.color-btn:hover{ transform:translateY(-1px); }
.color-btn.selected{
  border-color:#fff;
  box-shadow:0 0 0 3px rgba(255,255,255,0.18), 0 6px 18px -4px rgba(0,0,0,0.5);
  transform:translateY(-1px) scale(1.03);
}
.color-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

.row{ display:flex; gap:8px; }
button.action{
  flex:1 1 auto;
  padding:12px;
  border-radius:12px;
  border:0;
  cursor:pointer;
  font-weight:800;
  font-size:14px;
  transition:transform .12s var(--ease), filter .14s var(--ease), opacity .14s var(--ease);
}
button.action:active{ transform:scale(0.97); }
button.action:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
#spinBtn{ background:linear-gradient(135deg,var(--gold),#e0a83f); color:#241a03; box-shadow:0 10px 24px -8px rgba(255,207,92,0.45); }
#spinBtn:hover:not(:disabled){ filter:brightness(1.06); }
#resetBtn{ background:var(--panel-soft); color:var(--ink); border:1px solid var(--border); }
#resetBtn:hover{ background:rgba(255,255,255,0.06); }

.log-wrapper{ display:flex; flex-direction:column; gap:6px; }
.log{
  max-height:150px;
  overflow-y:auto;
  padding:8px;
  background:var(--panel-soft);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  font-size:12.5px;
  font-variant-numeric:tabular-nums;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.log-entry{ padding:5px 7px; border-radius:7px; color:var(--muted); }
.log-entry.latest{ background:rgba(255,207,92,0.12); color:var(--ink); font-weight:600; }
.log-entry.win{ color:var(--win); }
.log-entry.lose{ color:var(--lose); }

footer{ font-size:11.5px; color:var(--muted); text-align:center; line-height:1.5; }

/* ---------------- game panel ---------------- */
.game-panel{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:420px; padding:26px 18px; }

.marquee-frame{
  position:relative;
  width:100%;
  max-width:520px;
  padding:26px 18px 20px;
  border-radius:var(--radius-lg);
  background:radial-gradient(circle at 50% 20%, #0f1330, #070914 75%);
  border:1px solid var(--border);
  overflow:hidden;
}
.bulb-row{ position:absolute; left:14px; right:14px; display:flex; justify-content:space-between; pointer-events:none; }
.bulb-row.top{ top:8px; }
.bulb-row.bottom{ bottom:8px; }
.bulb{
  width:5px; height:5px; border-radius:50%;
  background:var(--gold-dim);
  box-shadow:0 0 0 rgba(255,207,92,0);
}
@media (prefers-reduced-motion:no-preference){
  .bulb{ animation:bulbPulse 1.8s ease-in-out infinite; }
}

@keyframes bulbPulse{
  0%,100%{ background:var(--gold-dim); box-shadow:0 0 0 rgba(255,207,92,0); }
  50%{ background:var(--gold); box-shadow:0 0 8px 2px rgba(255,207,92,0.7); }
}

.dice-stage{
  display:flex;
  justify-content:center;
  gap:26px;
  perspective:900px;
  padding:20px 0 10px;
}

.die-slot{ display:flex; flex-direction:column; align-items:center; gap:10px; }

.die{
  --s:64px;
  width:var(--s); height:var(--s);
  position:relative;
  transform-style:preserve-3d;
  transition:transform 1.15s var(--ease);
  filter:drop-shadow(0 10px 14px rgba(0,0,0,0.5));
}
.die.matched{ animation:diePop .5s var(--ease); }
@keyframes diePop{ 0%{transform:scale(1) rotateX(var(--rx,0)) rotateY(var(--ry,0));} 40%{transform:scale(1.12) rotateX(var(--rx,0)) rotateY(var(--ry,0));} 100%{transform:scale(1) rotateX(var(--rx,0)) rotateY(var(--ry,0));} }

.face{
  position:absolute;
  width:var(--s); height:var(--s);
  border-radius:9px;
  border:1px solid rgba(0,0,0,0.35);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25), inset 0 -10px 16px rgba(0,0,0,0.25), inset 0 8px 14px rgba(255,255,255,0.18);
}
.face.front{ transform:translateZ(calc(var(--s) / 2)); }
.face.back{ transform:rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.face.right{ transform:rotateY(90deg) translateZ(calc(var(--s) / 2)); }
.face.left{ transform:rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
.face.top{ transform:rotateX(90deg) translateZ(calc(var(--s) / 2)); }
.face.bottom{ transform:rotateX(-90deg) translateZ(calc(var(--s) / 2)); }

.die-glow{
  width:34px; height:6px;
  border-radius:6px;
  background:transparent;
  transition:background .2s var(--ease), box-shadow .2s var(--ease);
}
.die-glow.on{ box-shadow:0 0 14px 3px currentColor; }

.result-banner{
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:700;
  font-size:14.5px;
  color:var(--muted);
  padding-top:6px;
}
.result-banner.win{ color:var(--win); }
.result-banner.lose{ color:var(--lose); }

@media (max-width:500px){
  .money{ font-size:24px; }
  .die{ --s:50px; }
  .dice-stage{ gap:16px; }
}
</style>
</head>
<body>
  <div class="wrap">

    <!-- SIDE PANEL -->
    <div class="panel side">
      <div class="balance-block">
        <div>
          <div class="eyebrow">Balance</div>
          <div class="money" id="moneyDisplay">$0</div>
        </div>
      </div>

      <div class="payout-table" aria-hidden="true">
        <div><strong>1&times;</strong>1 match</div>
        <div><strong>2&times;</strong>2 matches</div>
        <div><strong>3&times;</strong>3 matches</div>
      </div>

      <div>
        <label for="betInput">Bet amount</label>
        <input id="betInput" type="number" min="1" step="1" value="10">
      </div>

      <div>
        <label id="colorPickLabel">Pick a color</label>
        <div class="colors" id="colorsList" role="group" aria-labelledby="colorPickLabel"></div>
      </div>

      <div class="row">
        <button class="action" id="spinBtn">Roll</button>
        <button class="action" id="resetBtn">Reset Money</button>
      </div>

      <div class="log-wrapper">
        <label>Game log</label>
        <div class="log" id="log"></div>
      </div>

      <footer>3 dice, 6 colors. Match your color on 1, 2 or 3 dice to win 1&times;, 2&times; or 3&times; your bet.</footer>
    </div>

    <!-- GAME PANEL -->
    <div class="panel game-panel">
      <div class="marquee-frame">
        <div class="bulb-row top" id="bulbTop"></div>
        <div class="bulb-row bottom" id="bulbBottom"></div>
        <div class="dice-stage" id="diceStage"></div>
        <div class="result-banner" id="resultBanner">Pick a color and roll the dice.</div>
      </div>
    </div>

  </div>

  <!-- Optional local library, used only for the reset-money dialog if present -->
  <script src="../plugins/sweetalert2@11"></script>
<script>
(() => {
  "use strict";

  const COLORS = [
    { name:'Red',    hex:'#ef4444' },
    { name:'Blue',   hex:'#3b82f6' },
    { name:'Yellow', hex:'#fbbf24' },
    { name:'Green',  hex:'#22c55e' },
    { name:'White',  hex:'#f4f4f5' },
    { name:'Violet', hex:'#a855f7' }
  ];
  // Which cube face each color lives on — identical for every die.
  const FACES = ['front','back','right','left','top','bottom'];
  const FACE_ROTATION = {
    front:  { x:0,   y:0   },
    back:   { x:0,   y:180 },
    right:  { x:0,   y:-90 },
    left:   { x:0,   y:90  },
    top:    { x:-90, y:0   },
    bottom: { x:90,  y:0   }
  };

  const KEY = 'colorGame_money';
  const LOG_KEY = 'colorGame_logs';
  const START_MONEY = 200;
  const MAX_LOGS = 12;
  const DICE_COUNT = 3;

  const moneyDisplay = document.getElementById('moneyDisplay');
  const betInput      = document.getElementById('betInput');
  const colorsList    = document.getElementById('colorsList');
  const spinBtn        = document.getElementById('spinBtn');
  const resetBtn       = document.getElementById('resetBtn');
  const logEl          = document.getElementById('log');
  const diceStage       = document.getElementById('diceStage');
  const resultBanner    = document.getElementById('resultBanner');
  const bulbTop         = document.getElementById('bulbTop');
  const bulbBottom      = document.getElementById('bulbBottom');

  let selectedColorIndex = 0;
  let money = loadMoney();
  let rolling = false;
  let dieEls = [];
  let dieGlowEls = [];

  // ------------------ persistence ------------------
  function loadMoney(){
    const raw = localStorage.getItem(KEY);
    if (raw === null) { localStorage.setItem(KEY, String(START_MONEY)); return START_MONEY; }
    const n = Number(raw);
    return Number.isFinite(n) ? n : START_MONEY;
  }
  function saveMoney(prevMoney){
    localStorage.setItem(KEY, String(money));
    animateMoney(prevMoney, money);
  }
  function animateMoney(from, to){
    const start = performance.now();
    const dur = 500;
    function tick(now){
      const t = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      moneyDisplay.textContent = '$' + (from + (to - from) * eased).toFixed(2);
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // ------------------ log ------------------
  function appendLog(text, kind){
    let logs = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
    logs.unshift({ text, kind: kind || '' });
    if (logs.length > MAX_LOGS) logs = logs.slice(0, MAX_LOGS);
    localStorage.setItem(LOG_KEY, JSON.stringify(logs));
    renderLogs();
  }
  function renderLogs(){
    const raw = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
    logEl.innerHTML = '';
    raw.forEach((entry, i) => {
      const item = typeof entry === 'string' ? { text: entry, kind:'' } : entry;
      const p = document.createElement('div');
      p.className = 'log-entry' + (i === 0 ? ' latest' : '') + (item.kind ? ' ' + item.kind : '');
      p.textContent = item.text;
      logEl.appendChild(p);
    });
  }
  renderLogs();

  // ------------------ color picker ------------------
  function renderColorButtons(){
    colorsList.innerHTML = '';
    COLORS.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'color-btn' + (i === selectedColorIndex ? ' selected' : '');
      btn.style.background = c.hex;
      btn.style.color = (c.name === 'White' || c.name === 'Yellow') ? '#1a1a1a' : '#fff';
      btn.textContent = c.name;
      btn.setAttribute('aria-pressed', i === selectedColorIndex ? 'true' : 'false');
      btn.addEventListener('click', () => {
        if (rolling) return;
        selectedColorIndex = i;
        renderColorButtons();
      });
      colorsList.appendChild(btn);
    });
  }
  renderColorButtons();
  moneyDisplay.textContent = '$' + money.toFixed(2);

  // ------------------ marquee bulbs ------------------
  function renderBulbs(row, count){
    row.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const b = document.createElement('span');
      b.className = 'bulb';
      b.style.animationDelay = (i * 0.09) + 's';
      row.appendChild(b);
    }
  }
  renderBulbs(bulbTop, 14);
  renderBulbs(bulbBottom, 14);

  // ------------------ dice ------------------
  function buildDice(){
    diceStage.innerHTML = '';
    dieEls = [];
    dieGlowEls = [];
    for (let i = 0; i < DICE_COUNT; i++) {
      const slot = document.createElement('div');
      slot.className = 'die-slot';

      const die = document.createElement('div');
      die.className = 'die';
      FACES.forEach((face, idx) => {
        const f = document.createElement('div');
        f.className = 'face ' + face;
        f.style.background = COLORS[idx].hex;
        die.appendChild(f);
      });
      // start on a random face so the tray isn't static before the first roll
      setDieRotation(die, Math.floor(Math.random() * COLORS.length), false);

      const glow = document.createElement('div');
      glow.className = 'die-glow';

      slot.appendChild(die);
      slot.appendChild(glow);
      diceStage.appendChild(slot);
      dieEls.push(die);
      dieGlowEls.push(glow);
    }
  }

  function setDieRotation(die, colorIndex, spin){
    const target = FACE_ROTATION[FACES[colorIndex]];
    const extraTurns = spin ? (3 + Math.floor(Math.random() * 2)) : 0;
    const dirX = Math.random() < 0.5 ? 1 : -1;
    const dirY = Math.random() < 0.5 ? 1 : -1;
    const rx = target.x + extraTurns * 360 * dirX;
    const ry = target.y + extraTurns * 360 * dirY;
    die.style.setProperty('--rx', rx + 'deg');
    die.style.setProperty('--ry', ry + 'deg');
    die.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
  }

  buildDice();

  // ------------------ roll + resolve ------------------
  function rollDice(){
    rolling = true;
    spinBtn.disabled = true;
    resultBanner.className = 'result-banner';
    resultBanner.textContent = 'Rolling…';
    dieGlowEls.forEach(g => { g.classList.remove('on'); g.style.color = 'transparent'; });

    const results = [];
    dieEls.forEach((die, i) => {
      const colorIndex = Math.floor(Math.random() * COLORS.length);
      results.push(colorIndex);
      die.classList.remove('matched');
      setDieRotation(die, colorIndex, true);
    });

    window.setTimeout(() => resolveResult(results), 1250);
  }

  function resolveResult(results){
    rolling = false;
    spinBtn.disabled = false;

    const bet = Number(betInput.value) || 0;
    const chosen = selectedColorIndex;
    const matches = results.filter(r => r === chosen).length;
    const prevMoney = money;

    results.forEach((colorIndex, i) => {
      if (colorIndex === chosen) {
        dieEls[i].classList.add('matched');
        dieGlowEls[i].classList.add('on');
        dieGlowEls[i].style.color = COLORS[colorIndex].hex;
      }
    });

    const diceNames = results.map(i => COLORS[i].name).join(', ');

    if (matches > 0) {
      const win = bet * matches;
      money += win;
      resultBanner.className = 'result-banner win';
      resultBanner.textContent = `${diceNames} — ${matches} match${matches > 1 ? 'es' : ''}! +$${win.toFixed(2)}`;
      appendLog(`Rolled ${diceNames} · bet $${bet} on ${COLORS[chosen].name} · ${matches}x match · +$${win.toFixed(2)}`, 'win');
    } else {
      money -= bet;
      resultBanner.className = 'result-banner lose';
      resultBanner.textContent = `${diceNames} — no match. -$${bet.toFixed(2)}`;
      appendLog(`Rolled ${diceNames} · bet $${bet} on ${COLORS[chosen].name} · no match · -$${bet.toFixed(2)}`, 'lose');
    }

    saveMoney(prevMoney);
  }

  spinBtn.addEventListener('click', () => {
    if (rolling) return;
    const bet = Number(betInput.value) || 0;
    if (bet <= 0) { appendLog('Enter a valid bet'); return; }
    if (bet > money) {
      appendLog('Not enough money');
      if (typeof Swal !== 'undefined') {
        Swal.fire({ icon:'error', title:'Insufficient Funds', text:`You only have $${money.toFixed(2)} available.`, timer:1500, showConfirmButton:false });
      } else {
        alert(`You only have $${money.toFixed(2)} available.`);
      }
      return;
    }
    rollDice();
  });

  resetBtn.addEventListener('click', () => {
    if (rolling) return;
    const applyReset = (n) => {
      const prevMoney = money;
      money = n;
      saveMoney(prevMoney);
      appendLog(`Money reset to $${money.toFixed(2)}`);
    };

    if (typeof Swal !== 'undefined') {
      Swal.fire({
        title: 'Reset Money',
        html: `<p>Enter the amount you want to reset your money to:</p>
               <input type="number" id="swal-money-input" value="${money}" min="1" step="1" style="width:100%;padding:8px;border-radius:8px;border:1px solid #ccc;">`,
        showCancelButton: true,
        confirmButtonText: 'Reset',
        cancelButtonText: 'Cancel',
        preConfirm: () => {
          const n = Number(document.getElementById('swal-money-input').value);
          if (!Number.isFinite(n) || n <= 0) { Swal.showValidationMessage('Enter a valid positive number'); return false; }
          return n;
        }
      }).then((result) => {
        if (result.isConfirmed) {
          applyReset(result.value);
          Swal.fire({ title:'Reset!', text:`Your money has been set to $${money.toFixed(2)}`, icon:'success', showConfirmButton:false, timer:1500 });
        }
      });
    } else {
      const val = prompt('Reset balance to:', String(money));
      const n = Number(val);
      if (Number.isFinite(n) && n > 0) applyReset(n);
    }
  });
})();
</script>
</body>
</html>
