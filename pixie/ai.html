<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full 3D Cube Room</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#111; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>

<script>
// Basic PIXI setup
const app = new PIXI.Application({ width: window.innerWidth, height: window.innerHeight, backgroundColor: 0x111111 });
document.body.appendChild(app.view);

// Matter.js setup
const Engine = Matter.Engine,
      World = Matter.World,
      Bodies = Matter.Bodies,
      Body = Matter.Body;

const engine = Engine.create();
engine.gravity.y = 0;
engine.gravity.x = 0;
const world = engine.world;

// Cube parameters
const cubeSize = 600;
const centerX = window.innerWidth/2;
const centerY = window.innerHeight/2;

// Create walls
const walls = [
    {x:centerX, y:centerY - cubeSize/2, w:cubeSize, h:20}, // ceiling
    {x:centerX, y:centerY + cubeSize/2, w:cubeSize, h:20}, // floor
    {x:centerX - cubeSize/2, y:centerY, w:20, h:cubeSize}, // left
    {x:centerX + cubeSize/2, y:centerY, w:20, h:cubeSize}  // right
];

// Pixi graphics for walls
const wallGraphics = [];
walls.forEach(w => {
    const g = new PIXI.Graphics();
    g.beginFill(0x444444);
    g.drawRect(-w.w/2, -w.h/2, w.w, w.h);
    g.endFill();
    app.stage.addChild(g);
    wallGraphics.push(g);

    // Add physics
    World.add(world, Bodies.rectangle(w.x, w.y, w.w, w.h, { isStatic:true }));
});

// Player box
const boxSize = 50;
const playerGraphics = new PIXI.Graphics();
playerGraphics.beginFill(0xffaa00);
playerGraphics.drawRect(-boxSize/2, -boxSize/2, boxSize, boxSize);
playerGraphics.endFill();
app.stage.addChild(playerGraphics);

// Shadow
const shadow = new PIXI.Graphics();
shadow.beginFill(0x000000, 0.5);
shadow.drawEllipse(0, 0, boxSize, boxSize/3);
shadow.endFill();
app.stage.addChild(shadow);

// Light source
let light = { x:centerX, y:centerY - 200 };
window.addEventListener("mousemove", e => { light.x = e.clientX; light.y = e.clientY; });

// Player body
const playerBody = Bodies.rectangle(centerX, centerY, boxSize, boxSize, { restitution:0.5, frictionAir:0.2 });
World.add(world, playerBody);

// Keyboard movement
const keys = {};
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

// Animation loop
app.ticker.add(() => {
    Engine.update(engine);

    // Move player
    const speed = 5;
    let dx = 0, dy = 0;
    if(keys['ArrowLeft']) dx -= speed;
    if(keys['ArrowRight']) dx += speed;
    if(keys['ArrowUp']) dy -= speed;
    if(keys['ArrowDown']) dy += speed;
    Body.translate(playerBody, {x: dx, y: dy});

    // Boundaries inside cube
    const minX = centerX - cubeSize/2 + boxSize/2;
    const maxX = centerX + cubeSize/2 - boxSize/2;
    const minY = centerY - cubeSize/2 + boxSize/2;
    const maxY = centerY + cubeSize/2 - boxSize/2;
    playerBody.position.x = Math.min(Math.max(playerBody.position.x, minX), maxX);
    playerBody.position.y = Math.min(Math.max(playerBody.position.y, minY), maxY);

    // Sync Pixi
    playerGraphics.x = playerBody.position.x;
    playerGraphics.y = playerBody.position.y;

    // Fake 3D scaling
    const height = maxY - playerBody.position.y;
    playerGraphics.scale.set(1 + height/600);

    // Shadow based on light
    const dxL = playerBody.position.x - light.x;
    const dyL = playerBody.position.y - light.y;
    shadow.x = playerBody.position.x - dxL/4;
    shadow.y = playerBody.position.y - dyL/4;
    shadow.scale.x = 1 + Math.abs(dxL)/500;
    shadow.scale.y = 0.5 + Math.abs(dyL)/1000;
    shadow.alpha = 0.5 - Math.min(Math.sqrt(dxL*dxL + dyL*dyL)/800, 0.4);

    // Pseudo-3D wall perspective
    wallGraphics.forEach((g,i) => {
        if(i<2){ // floor & ceiling
            g.y = walls[i].y + (i===0?-1:1)*(height/3); // ceiling moves opposite to floor
            g.scale.x = 1 + height/800;
        } else { // left & right walls
            const offset = (playerBody.position.y - minY)/6;
            g.x = walls[i].x + (i===2?-1:1)*offset;
            g.scale.y = 1 + height/600;
        }
    });
});
</script>
</body>
</html>
