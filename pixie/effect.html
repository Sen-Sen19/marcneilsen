<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Playground Working</title>
<style>
  body { margin:0; overflow:hidden; background:#111; }
  canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>

<script>
const app = new PIXI.Application({ width: window.innerWidth, height: window.innerHeight, backgroundColor: 0x111111 });
document.body.appendChild(app.view);

const Engine = Matter.Engine,
      World = Matter.World,
      Bodies = Matter.Bodies,
      Body = Matter.Body;

const engine = Engine.create();
const world = engine.world;
Engine.run(engine);

// Create walls
const walls = [
    Bodies.rectangle(app.screen.width/2, -10, app.screen.width, 20, { isStatic:true }),
    Bodies.rectangle(app.screen.width/2, app.screen.height+10, app.screen.width, 20, { isStatic:true }),
    Bodies.rectangle(-10, app.screen.height/2, 20, app.screen.height, { isStatic:true }),
    Bodies.rectangle(app.screen.width+10, app.screen.height/2, 20, app.screen.height, { isStatic:true })
];
World.add(world, walls);

// Particle array
const particles = [];

function randomColor() {
    const colors = [0xff4f4f, 0xffcc4f, 0x4fffcc, 0x4f4fff, 0xff4fff, 0x4fff4f];
    return colors[Math.floor(Math.random()*colors.length)];
}

function createParticle(x, y, radius=8) {
    const color = randomColor();
    const body = Bodies.circle(x, y, radius, { restitution:0.9, frictionAir:0.02 });
    World.add(world, body);

    const graphics = new PIXI.Graphics();
    graphics.beginFill(color);
    graphics.drawCircle(0,0,radius);
    graphics.endFill();
    graphics.alpha = 0.9;
    app.stage.addChild(graphics);

    particles.push({ body, graphics, color, radius });
}

// Update loop
app.ticker.add(()=>{
    particles.forEach(p=>{
        p.graphics.x = p.body.position.x;
        p.graphics.y = p.body.position.y;
    });
});

// Spawn helpers
function spawnCircle(cx, cy, r, count){
    for(let i=0;i<count;i++){
        const angle = Math.random()*Math.PI*2;
        const dist = Math.random()*r;
        const x = cx + Math.cos(angle)*dist;
        const y = cy + Math.sin(angle)*dist;
        createParticle(x, y, 5 + Math.random()*5);
    }
}

function spawnRectangle(x, y, w, h, count){
    for(let i=0;i<count;i++){
        const px = x + Math.random()*w;
        const py = y + Math.random()*h;
        createParticle(px, py, 5 + Math.random()*5);
    }
}

// Spawn initial particles
spawnCircle(400, 300, 80, 20);
spawnRectangle(700, 200, 200, 100, 20);

// Simple explosions
function explode(x, y, radius=120, force=0.02){
    particles.forEach(p=>{
        const dx = p.body.position.x - x;
        const dy = p.body.position.y - y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < radius){
            const angle = Math.atan2(dy, dx);
            Body.applyForce(p.body, p.body.position, { x: Math.cos(angle)*force, y: Math.sin(angle)*force });
        }
    });
}

setInterval(()=>{
    const x = Math.random()*app.screen.width;
    const y = Math.random()*app.screen.height;
    explode(x, y, 150, 0.03);
}, 2000);

</script>
</body>
</html>
