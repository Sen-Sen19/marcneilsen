<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/arsen.png">
<title>Arsen</title>
<style>
/* ===========================
   Global Styles
=========================== */
body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #121212;
  color: #e0e0e0;
  overflow: hidden;
}

/* ===========================
   Toolbar
=========================== */
#toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 10px 15px;
  background: #1c1c1c;
  box-shadow: 0 3px 8px rgba(0,0,0,0.6);
  border-bottom: 1px solid #333;
  position: relative;
}

/* ===========================
   Toolbar Buttons & Inputs
=========================== */
#toolbar button, 
#toolbar input[type=color], 
#toolbar input[type=checkbox], 
#toolbar input[type=number] {
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
  background: #2a2a2a;
  color: #e0e0e0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

#toolbar button:hover, 
#toolbar input[type=color]:hover, 
#toolbar input[type=number]:hover {
  background: #3a3a3a;
}

/* ===========================
   Labels
=========================== */
label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.9rem;
  margin: 0;
  line-height: 1.2;
}

/* ===========================
   Canvas
=========================== */
canvas {
  display: block;
  width: 100%;
  height: calc(100vh - 60px);
  margin: 0;
  padding: 0;
  border-top: 1px solid #333;
}

/* ===========================
   Inputs
=========================== */
input[type=number] {
  width: 60px;
  background: #2a2a2a;
  color: #e0e0e0;
  border-radius: 6px;
  text-align: center;
}

input[type=checkbox] {
  accent-color: #7dd3fc;
}

input[type=color] {
  appearance: none;
  width: 32px;
  height: 32px;
  border: none;
  padding: 0;
  margin: 0;
  background: #2a2a2a;
  cursor: pointer;
  box-sizing: border-box;
}
input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
input[type=color]::-webkit-color-swatch { border-radius: 0; border: none; }
input[type=color]::-moz-color-swatch { border-radius: 0; border: none; }

/* ===========================
   Icon Buttons
=========================== */
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #2a2a2a;
  border: none;
  transition: all 0.2s ease;
}
.icon-btn svg {
  width: 20px;
  height: 20px;
  fill: #e0e0e0;
}
.icon-btn:hover { background: #3a3a3a; }
.icon-btn:hover svg { fill: #7dd3fc; }

/* ===========================
   Toolbar Groups
=========================== */
#toolbar .group {
  display: flex;
  gap: 8px;
  align-items: center;
}

/* ===========================
   Panels
=========================== */
#elementsPanel, #appearancePanel {
  position: absolute;
  display: none;
  flex-direction: column;
  gap: 8px;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 6px;
  padding: 10px;
  z-index: 100;
  min-width: 150px;
  color: #ffffff;
}

#appearancePanel { min-width: 200px; }

#elementsPanel button, #appearancePanel button {
  width: 100%;
  text-align: left;
  background: #3a3a3a;
  border-radius: 4px;
  padding: 6px;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
  color: #ffffff;
}
#elementsPanel button:hover, #appearancePanel button:hover { background: #555; }

/* ===========================
   Appearance Sub-panels
=========================== */
#appearancePanel .section { display: flex; flex-direction: column; gap: 5px; }
#appearancePanel strong { font-size: 0.9rem; color: #7dd3fc; }

#appearancePanel .section-wrapper {
  position: relative;
}
#appearancePanel .sub-panel {
  position: absolute;
  top: 0;
  left: 100%;
  display: flex;
  flex-direction: column;
  background: #3a3a3a;
  border: 1px solid #555;
  border-radius: 6px;
  padding: 8px;
  min-width: 180px;
  gap: 6px;
  z-index: 200;
  opacity: 0;
  transform: translateX(-10px);
  transition: all 0.2s ease;
  pointer-events: auto;
}
#appearancePanel .section-wrapper.active .sub-panel {
  opacity: 1;
  transform: translateX(0);
}
#appearancePanel .sub-panel input, #appearancePanel .sub-panel select {
  width: 100%;
  margin-top: 2px;
}

/* ===========================
   Modal Base
=========================== */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0);
  justify-content: center;
  align-items: center;
}

/* ===========================
   Modal Content
=========================== */
.modal-content .close {
  position: absolute;
  top:2px;
  right: 10px;
  font-size: 22px;
  cursor: pointer;
  color: #7dd3fc;
  padding: 0;
  line-height: 1;
}

.modal-section {
  margin: 0;
  padding: 0;
  background: #2a2a2a;
  border-radius: 6px;
  overflow: hidden;
}

.modal-section h3 {
  margin: 0;
  padding: 6px 12px;
  font-size: 1rem;
  color: #7dd3fc;
  font-weight: 600;
  background: #1f1f1f;
  border-bottom: 1px solid #444;
}

/* ===========================
   Modal Fields
=========================== */
.modal-field {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 12px;
}

.modal-field label {
  font-size: 0.9rem;
  color: #e0e0e0;
  margin: 0;
  flex: 1;
}

.modal-field input,
.modal-field select {
  flex: 1;
  padding: 4px 6px;
  border-radius: 4px;
  border: 1px solid #555;
  background: #3a3a3a;
  color: #e0e0e0;
}

.number-drag-wrapper {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.number-drag-handle {
  width: 10px;
  height: 20px;
  background: #7dd3fc;
  cursor: ew-resize;
  border-radius: 3px;
  flex-shrink: 0;
}

#tablePreview div {
  background: #3a3a3a;
  width: 20px;
  height: 20px;
  border-radius: 3px;
}

/* ===========================
   Charts Modal
=========================== */
#chartsModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#chartsModal .modal-content {
  background: #1e1e1e;
  padding: 20px;
  border-radius: 12px;
  width: 600px;
  color: #fff;
}

/* ===========================
   Chart Buttons
=========================== */
.chart-btn {
  background: #2a2a2a;
  color: #fff;
  border: none;
  padding: 10px 14px;
  margin: 5px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.3s;
}
.chart-btn:hover {
  background: #3a3a3a;
}
.chart-btn.active {
  background: #7dd3fc;
  color: #000;
}

/* ===========================
   Insert Button
=========================== */
#insertChartBtn {
  background: #333;
  color: #fff;
  border: none;
  padding: 12px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 20px;
  border-radius: 8px;
  width: 100%;
}
#insertChartBtn:hover {
  background: #444;
}

/* ===========================
   Chart Preview
=========================== */
#chartPreview {
  background: #121212;
  border-radius: 8px;
  padding: 10px;
  min-height: 300px;
  margin-top: 20px;
}
/* Modal backdrop */
#generateModal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

/* Fixed size modal content */
#generateModal .modal-content {
  background: #1e1e1e;
  color: #fff;
  width: 600px;           /* fixed width */
  max-width: 95%;         /* responsive fallback */
  height: 80vh;           /* fixed height relative to viewport */
  padding: 16px;
  border-radius: 8px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  overflow: hidden;       /* prevent outer overflow */
  position: relative;
}

/* Code blocks scrollable */
#generatedHtml, #generatedCss {
  display: block;
  white-space: pre-wrap;   /* preserve formatting */
  font-family: monospace;
  flex: 1;                 /* take available vertical space */
  overflow: auto;          /* scroll if content too long */
  background: #111;
  border-radius: 4px;
  padding: 8px;
  margin-bottom: 12px;
}

/* Close button */
#closeGenerateModal {
  position: absolute;
  top: 8px;
  right: 12px;
  cursor: pointer;
  font-size: 20px;
  color: #fff;
}
/* ===========================
   Layers Panel
=========================== */
#layersPanel {
  position: fixed;
  top: 60px; /* below toolbar */
  left: 0;
  width: 220px;
  height: calc(100vh - 60px);
  background: #1c1c1c;
  border-right: 1px solid #333;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 50;
  overflow-y: auto;
}

#layersPanel h3 {
  color: #7dd3fc;
  margin: 0 0 6px 0;
  font-size: 1rem;
}

#layersPanel ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

#layersPanel ul li {
  padding: 6px 8px;
  margin-bottom: 4px;
  background: #2a2a2a;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
}

#layersPanel ul li:hover {
  background: #3a3a3a;
}
/* Layer buttons style */
.layer-btn {
    display: block;
    width: 100%;
    background-color: #333;
    color: #fff;
    border: none;
    padding: 8px 10px;
    margin-bottom: 5px;
    text-align: left;
    cursor: pointer;
    border-radius: 6px;
    font-size: 14px;
    transition: background 0.2s ease;
}
.layer-btn:hover {
    background-color: #444;
}

/* Pulsing yellow effect for selected element */
.highlight-pulse {
    outline: 3px solid yellow;
    outline-offset: -3px;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { outline-color: yellow; }
    50% { outline-color: orange; }
    100% { outline-color: yellow; }
}

</style>
</head>
<body>
<div id="toolbar">
  <div class="group">
    <label>Background: <input type="color" id="bgColor" value="#1e1e1e"></label>
    <label><input type="checkbox" id="showGrid"> Grid</label>
    <label>Divisions: <input type="number" id="gridCount" value="20" min="5" max="100"></label>
    <label><input type="checkbox" id="snapGrid"> Snap</label>
  </div>
  
  <div class="group">
    <button id="elementsBtn">Elements</button>
    <button id="appearanceBtn">Appearance</button>

      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm2 3h14v12H5V9zm3 2v8h2v-8H8zm4 0v8h2v-8h-2z"/></svg>
    </button>
  </div>
  
  <div class="group">
    <button id="insertTableBtn">Insert Table</button>

</div>

<!-- Panels -->
<div id="elementsPanel">

  <button data-element="textbox">Textbox</button>
  <button data-element="label">Label</button>
  <button data-element="button">Button</button>
  <button data-element="checkbox">Checkbox</button>
  <button data-element="radio">Radio</button>
  <button data-element="dropdown">Dropdown</button>
  <button data-element="textarea">Textarea</button>
  <button data-element="toggle">Toggle Switch</button>
  <button data-element="slider">Slider</button>
  <button data-element="date">Date Picker</button>
  <button data-element="number">Number Input</button>
  <button data-element="image">Image</button>
  <button data-element="icon">Icon</button>
</div>
</div>
<div id="appearancePanel">
  <div class="section-wrapper" data-appearance="fill">
    <button>Fill & Background</button>
  </div>
  <div class="section-wrapper" data-appearance="border">

  <div class="section-wrapper" data-appearance="corners">

  </div>
  
  <div class="section-wrapper" data-appearance="shadow">
    <button>Shadow</button>
  </div>
  <div class="section-wrapper" data-appearance="filters">
    <button>Filters</button>
  </div>
  <div class="section-wrapper" data-appearance="transform">
    <button>Transform</button>
  </div>
  <div class="section-wrapper" data-appearance="blend">
    <button>Blend Mode</button>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Insert Table Modal -->
<div id="tableModal" class="modal">
  <div class="modal-content" style="min-width: 320px; padding: 16px;">
    <span class="close" id="closeTableModal">&times;</span>
    <h3 style="margin: 0 0 10px; color:#7dd3fc;">Insert Table</h3>
    
    <div class="modal-field">
      <label>Rows:</label>

    </div>
    
    <div style="text-align:right; margin-top:12px;">
      <button id="insertTableConfirm" style="padding:6px 12px; background:#7dd3fc; color:#000; font-weight:bold; border:none; border-radius:4px; cursor:pointer;">Insert Table</button>
    </div>
  </div>
</div>

<!-- Add Charts Modal -->
<div id="chartsModal" class="modal">
  <div class="modal-content">
   <h2 style="color: #7dd3fc;">Insert Chart</h2>

   <div class="chart-options">
  <button class="chart-btn" data-chart="bar">Bar Chart</button>
  <button class="chart-btn" data-chart="horizontal-bar">Horizontal Bar Chart</button>
  <button class="chart-btn" data-chart="stacked-bar">Stacked Bar Chart</button>
  <button class="chart-btn" data-chart="line">Line Chart</button>
  <button class="chart-btn" data-chart="area">Area Chart</button>
  <button class="chart-btn" data-chart="pie">Pie Chart</button>
  <button class="chart-btn" data-chart="scatter">Scatter Plot</button>
  
</div>

    <div id="chartPreview" style="width:100%; height:300px; margin-top:20px;"></div>
    <button id="insertChartBtn">Insert Chart</button>
  </div>
</div>






<!-- Generate Code Modal -->
<div id="generateModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:9999;">
  <div class="modal-content" style="background:#1e1e1e; color:#fff; padding:16px; max-width:700px; width:95%; position:relative; display:flex; flex-direction:column; gap:12px;">
    
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="color:#7dd3fc; margin:0;">Generated Code</h2>
      <div>
        <button id="exportCodeBtn" style="margin-right:8px; padding:6px 12px; background:#22c55e; border:none; border-radius:4px; cursor:pointer;">Export .html</button>
        <span class="close" id="closeGenerateModal" style="cursor:pointer; font-size:24px;">&times;</span>
      </div>
    </div>

    <div style="flex:1; overflow:auto;">
      <strong>CSS:</strong>
      <pre><code class="language-css" id="generatedCss"></code></pre>

      <strong>HTML:</strong>
      <pre><code class="language-html" id="generatedHtml"></code></pre>
    </div>

    <button id="copyCodeBtn" style="align-self:flex-start; padding:8px 14px; background:#7dd3fc; border:none; border-radius:4px; cursor:pointer;">Copy Code</button>
  </div>
</div>



<div id="layersPanel">
  <h3>Layers Panel</h3>
  <ul id="layerList">

  </ul>
</div>


<canvas id="canvas"></canvas>
<script src="https://code.highcharts.com/12/highcharts.js"></script>
<link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/clipboard/prism-clipboard.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="js/canva.js"></script>
<script src="js/elements.js"></script>
<script src="js/background_grid.js"></script>
<script src="js/appearance.js"></script>
<script src="js/chart.js"></script>
<script src="js/table.js"></script>

<script src="js/generate_code.js"></script>



<script>
const layersList = document.getElementById('layerList');

// Function to update the layers panel
function updateLayersPanel() {
    layersList.innerHTML = ''; // Clear old list

   elementsOnCanvas.forEach((el, i) => {

        const item = document.createElement('li');
        const btn = document.createElement('button');
        btn.textContent = el.name || el.type; // default name
        btn.classList.add('layer-btn');

        // Click → highlight element on canvas
    btn.addEventListener('click', () => {
    selectedElement = el;
    highlightElement(el, 3000);
    updateLayersPanel();
});


        // Double-click → rename
    btn.addEventListener('dblclick', () => {
    const newName = prompt('Enter new name:', el.name || el.type);
    if (newName && newName.trim() !== '') {
        el.name = newName.trim();
        updateLayersPanel(); // refresh panel
        drawCanvas(); // redraw canvas
    }
});

        item.appendChild(btn);
        layersList.appendChild(item);
    });
}

// Call updateLayersPanel whenever you add/remove elements

</script>
