<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
body {
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 50px;
}

h1 {
  margin-bottom: 20px;
}

#scoreboard {
  margin-bottom: 20px;
  font-size: 18px;
}

#game {
  display: grid;
  grid-template-columns: repeat(3, 100px);
  grid-template-rows: repeat(3, 100px);
  gap: 5px;
}

.cell {
  width: 100px;
  height: 100px;
  background: #f2f2f2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  cursor: pointer;
}

.cell:hover {
  background: #ddd;
}

#message {
  margin-top: 20px;
  font-size: 20px;
}

button {
  margin-top: 20px;
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
}
</style>
</head>
<body>
<h1>Tic Tac Toe</h1>

<div id="scoreboard">
  Player: <span id="playerScore">0</span> |
  Bot: <span id="botScore">0</span> |
  Draws: <span id="drawScore">0</span>
</div>

<div id="game">
  <div class="cell" data-index="0"></div>
  <div class="cell" data-index="1"></div>
  <div class="cell" data-index="2"></div>
  <div class="cell" data-index="3"></div>
  <div class="cell" data-index="4"></div>
  <div class="cell" data-index="5"></div>
  <div class="cell" data-index="6"></div>
  <div class="cell" data-index="7"></div>
  <div class="cell" data-index="8"></div>
</div>

<div id="message"></div>
<button id="restart">Restart Game</button>

<script>
const cells = document.querySelectorAll('.cell');
const message = document.getElementById('message');
const restartBtn = document.getElementById('restart');

let board = ['', '', '', '', '', '', '', '', ''];
const player = 'X';
const bot = 'O';
let gameOver = false;

// Load scores from localStorage or initialize
let playerScore = parseInt(localStorage.getItem('playerScore')) || 0;
let botScore = parseInt(localStorage.getItem('botScore')) || 0;
let drawScore = parseInt(localStorage.getItem('drawScore')) || 0;

// Display scores
const playerScoreEl = document.getElementById('playerScore');
const botScoreEl = document.getElementById('botScore');
const drawScoreEl = document.getElementById('drawScore');
updateScoreboard();

cells.forEach(cell => cell.addEventListener('click', playerMove));
restartBtn.addEventListener('click', restartGame);

function playerMove(e) {
  const index = e.target.dataset.index;
  if (board[index] === '' && !gameOver) {
    board[index] = player;
    e.target.textContent = player;
    if (checkWinner(board, player)) {
      message.textContent = "You Win!";
      playerScore++;
      saveScores();
      updateScoreboard();
      gameOver = true;
      return;
    }
    if (boardFull()) {
      message.textContent = "Draw!";
      drawScore++;
      saveScores();
      updateScoreboard();
      gameOver = true;
      return;
    }
    botMove();
  }
}

function botMove() {
  const bestMoveIndex = minimax(board, bot).index;
  board[bestMoveIndex] = bot;
  cells[bestMoveIndex].textContent = bot;

  if (checkWinner(board, bot)) {
    message.textContent = "Bot Wins!";
    botScore++;
    saveScores();
    updateScoreboard();
    gameOver = true;
    return;
  }
  if (boardFull()) {
    message.textContent = "Draw!";
    drawScore++;
    saveScores();
    updateScoreboard();
    gameOver = true;
  }
}

function checkWinner(b, player) {
  const winCombos = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  return winCombos.some(combo => combo.every(i => b[i] === player));
}

function boardFull() {
  return board.every(cell => cell !== '');
}

function restartGame() {
  board = ['', '', '', '', '', '', '', '', ''];
  cells.forEach(cell => cell.textContent = '');
  message.textContent = '';
  gameOver = false;
}

function updateScoreboard() {
  playerScoreEl.textContent = playerScore;
  botScoreEl.textContent = botScore;
  drawScoreEl.textContent = drawScore;
}

function saveScores() {
  localStorage.setItem('playerScore', playerScore);
  localStorage.setItem('botScore', botScore);
  localStorage.setItem('drawScore', drawScore);
}

// ===== Minimax Algorithm =====
function minimax(newBoard, currentPlayer) {
  const availSpots = newBoard.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);

  if (checkWinner(newBoard, player)) return { score: -10 };
  if (checkWinner(newBoard, bot)) return { score: 10 };
  if (availSpots.length === 0) return { score: 0 };

  const moves = [];

  for (let i = 0; i < availSpots.length; i++) {
    const move = {};
    move.index = availSpots[i];
    newBoard[availSpots[i]] = currentPlayer;

    if (currentPlayer === bot) {
      const result = minimax(newBoard, player);
      move.score = result.score;
    } else {
      const result = minimax(newBoard, bot);
      move.score = result.score;
    }

    newBoard[availSpots[i]] = '';
    moves.push(move);
  }

  let bestMove;
  if (currentPlayer === bot) {
    let bestScore = -Infinity;
    moves.forEach(m => { if (m.score > bestScore) { bestScore = m.score; bestMove = m; } });
  } else {
    let bestScore = Infinity;
    moves.forEach(m => { if (m.score < bestScore) { bestScore = m.score; bestMove = m; } });
  }

  return bestMove;
}
</script>
</body>
</html>
